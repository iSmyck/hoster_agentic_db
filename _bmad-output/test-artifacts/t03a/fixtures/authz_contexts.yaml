        - space_id: sales
          path_prefix: /pricing
          capabilities:
            - propose

  - name: missing_stable_id
    description: AuthzContext without stable_id must fail schema validation.
    expected_valid: false
    payload:
      schema_version: authz-context-v2
      context_id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
