      evaluated_at: "2026-11-08T10:00:00Z"
      expires_at: "2026-11-08T11:00:00Z"
      revocation_epoch: 1
      space_scopes:
        - space_id: sales
          repository_id: repo-sales
          capabilities:
            - read
            - search
            - propose
            - source_read
          policy_bundle_id: sales-bundle
          access_policy_revision: "0000000000000000000000000000000000000001"
          approval_policy_revision: "0000000000000000000000000000000000000002"
