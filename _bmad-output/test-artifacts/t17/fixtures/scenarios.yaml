scenarios:
  route_activation_gate:
    fixtures:
      - name: markdown_only_na
        input:
          markdown_only_workload: true
          owner_authorized_samples: false
          format_agreement: false
          quality_review: false
          data_media_profile: false
        expected:
          status: PASS
      - name: non_markdown_activated
        input:
          markdown_only_workload: false
          owner_authorized_samples: true
          format_agreement: true
          quality_review: true
          data_media_profile: true
        expected:
          status: PASS
      - name: missing_samples_blocked
        input:
          markdown_only_workload: false
          owner_authorized_samples: false
          format_agreement: true
          quality_review: true
          data_media_profile: true
        expected:
          status: FAIL
          error: INVALID_CONFIG
      - name: missing_format_agreement_blocked
        input:
          markdown_only_workload: false
          owner_authorized_samples: true
          format_agreement: false
          quality_review: true
          data_media_profile: true
        expected:
          status: FAIL
          error: INVALID_CONFIG

  docling_assessment:
    fixtures:
      - name: docling_only
        input:
          docling_assessed: true
          second_pipeline_considered: false
          documented_unmet_need: false
          approved_adr: false
          compatibility_license_rollback_assessed: false
        expected:
          status: PASS
      - name: docling_plus_second_pipeline_with_adr
        input:
          docling_assessed: true
          second_pipeline_considered: true
          documented_unmet_need: true
          approved_adr: true
          compatibility_license_rollback_assessed: true
        expected:
          status: PASS
      - name: second_pipeline_without_adr_rejected
        input:
          docling_assessed: true
          second_pipeline_considered: true
          documented_unmet_need: true
          approved_adr: false
          compatibility_license_rollback_assessed: false
        expected:
          status: FAIL
          error: INVALID_CONFIG
      - name: docling_not_assessed_rejected
        input:
          docling_assessed: false
          second_pipeline_considered: true
          documented_unmet_need: true
          approved_adr: true
          compatibility_license_rollback_assessed: true
        expected:
          status: FAIL
          error: INVALID_CONFIG

  golden_fixtures:
    fixtures:
      - name: pdf_golden_complete
        input:
          format_supported: true
          metrics:
            page_or_slide_count: 12
            encoding: utf-8
            reading_order_valid: true
            table_structure_valid: true
            numbers_preserved: true
            links_anchors_preserved: true
        expected:
          status: PASS
      - name: pptx_golden_complete
        input:
          format_supported: true
          metrics:
            page_or_slide_count: 8
            encoding: utf-8
            reading_order_valid: true
            table_structure_valid: true
            numbers_preserved: true
            links_anchors_preserved: true
        expected:
          status: PASS
      - name: unsupported_format_rejected
        input:
          format_supported: false
          metrics:
            page_or_slide_count: 0
            encoding: ""
            reading_order_valid: false
            table_structure_valid: false
            numbers_preserved: false
            links_anchors_preserved: false
        expected:
          status: FAIL
          error: VALIDATION_ERROR
      - name: missing_reading_order_rejected
        input:
          format_supported: true
          metrics:
            page_or_slide_count: 12
            encoding: utf-8
            reading_order_valid: false
            table_structure_valid: true
            numbers_preserved: true
            links_anchors_preserved: true
        expected:
          status: FAIL
          error: VALIDATION_ERROR

  loss_quarantine:
