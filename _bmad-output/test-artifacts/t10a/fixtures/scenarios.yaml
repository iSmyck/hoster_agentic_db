scenarios:
  exact_sha_build:
    fixtures:
      - name: webhook_hint_resolves_exact_sha
        input:
          main_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          resolved_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          read_only: true
          webhook_hint_only: true
          git_write_capability: false
        expected:
          status: PASS
      - name: resolved_sha_mismatch
        input:
          main_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          resolved_sha: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          read_only: true
          webhook_hint_only: true
          git_write_capability: false
        expected:
          status: FAIL
          error: STALE_BASE
      - name: ci_write_capability_rejected
        input:
          main_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          resolved_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          read_only: false
          webhook_hint_only: true
          git_write_capability: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: branch_hint_without_exact_sha
        input:
          main_sha: null
          resolved_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          read_only: true
          webhook_hint_only: false
          git_write_capability: false
        expected:
          status: FAIL
          error: STALE_BASE

  preflight_artifact:
    fixtures:
      - name: valid_inactive_preflight
        input:
          snapshot_sha: "cccccccccccccccccccccccccccccccccccccccc"
          cutover_sha: "cccccccccccccccccccccccccccccccccccccccc"
          is_preflight: true
          serving_allowed: false
          purpose: cutover_preflight
          run_type: full
          state: ready
        expected:
          status: PASS
      - name: activated_preflight_rejected
        input:
          snapshot_sha: "cccccccccccccccccccccccccccccccccccccccc"
          cutover_sha: "cccccccccccccccccccccccccccccccccccccccc"
          is_preflight: false
          serving_allowed: true
          purpose: published
          run_type: full
          state: active
        expected:
          status: FAIL
          error: INVALID_STATE
      - name: cutover_sha_mismatch
        input:
          snapshot_sha: "cccccccccccccccccccccccccccccccccccccccc"
          cutover_sha: "dddddddddddddddddddddddddddddddddddddddd"
          is_preflight: true
          serving_allowed: false
          purpose: cutover_preflight
          run_type: full
          state: ready
        expected:
          status: FAIL
          error: INVALID_STATE
      - name: incremental_preflight_rejected
        input:
          snapshot_sha: "cccccccccccccccccccccccccccccccccccccccc"
          cutover_sha: "cccccccccccccccccccccccccccccccccccccccc"
          is_preflight: true
          serving_allowed: false
          purpose: cutover_preflight
          run_type: incremental
          state: ready
        expected:
          status: FAIL
          error: INVALID_STATE

