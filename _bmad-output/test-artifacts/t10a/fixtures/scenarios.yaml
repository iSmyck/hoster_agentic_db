  eligible_content_exclusion:
    fixtures:
      - name: only_eligible_content
        input:
          documents:
            - path: pricing.md
              projected: true
            - path: guide/intro.md
              projected: true
        expected:
          status: PASS
      - name: inbox_excluded
        input:
          documents:
            - path: pricing.md
              projected: true
            - path: inbox/proposal.md
              projected: true
              ineligible_reason: inbox
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: template_excluded
        input:
          documents:
            - path: templates/page-template.md
              projected: true
              ineligible_reason: template
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: service_file_excluded
        input:
          documents:
            - path: service/INDEX.md
              projected: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: archived_excluded
        input:
          documents:
            - path: archive/old-pricing.md
              projected: true
              archived: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: deleted_excluded
        input:
          documents:
            - path: deleted/removed.md
              projected: true
              deleted: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: unverified_critical_media_excluded
        input:
          documents:
            - path: diagrams/handwritten-flow.png
              projected: true
              unverified_critical_media: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: pending_branch_excluded
        input:
          documents:
            - path: draft/pending-mr.md
              projected: true
              pending_branch: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: rejected_branch_excluded
        input:
          documents:
            - path: draft/rejected-mr.md
              projected: true
              rejected_branch: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED

  idempotent_rebuild:
    fixtures:
      - name: duplicate_webhook_no_new_active
        input:
          duplicate_webhook: true
          kb_index_lost: false
          same_main_sha: true
          canonical_git_changed: false
          new_active_created: false
        expected:
          status: PASS
      - name: kb_index_loss_rebuild_same_sha
        input:
          duplicate_webhook: false
          kb_index_lost: true
          same_main_sha: true
          canonical_git_changed: false
          new_active_created: false
        expected:
          status: PASS
      - name: rebuild_changed_canonical_git
        input:
          duplicate_webhook: false
          kb_index_lost: true
          same_main_sha: true
          canonical_git_changed: true
          new_active_created: false
        expected:
          status: FAIL
          error: RECOVERY_REQUIRED
      - name: duplicate_created_active
        input:
          duplicate_webhook: true
          kb_index_lost: false
          same_main_sha: true
          canonical_git_changed: false
          new_active_created: true
        expected:
          status: FAIL
          error: INVALID_STATE
