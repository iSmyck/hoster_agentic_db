scenarios:
  scope:
    fixtures:
      - name: page_scope_exact_sha
        input:
          server_scope: page
          model_scope: page
          revision_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        expected:
          status: PASS
      - name: subtree_scope_narrows
        input:
          server_scope: subtree
          model_scope: page
          revision_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        expected:
          status: PASS
      - name: space_scope_narrows_to_subtree
        input:
          server_scope: space
          model_scope: subtree
          revision_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        expected:
          status: PASS
      - name: scope_widening_rejected
        input:
          server_scope: page
          model_scope: subtree
          revision_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: missing_revision_sha
        input:
          server_scope: page
          model_scope: page
          revision_sha: ""
        expected:
          status: FAIL
          error: VALIDATION_ERROR
  direct_read:
    fixtures:
      - name: canonical_read_with_bounds
        input:
          via_go: true
          revision_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          bounds:
            start_line: 1
            end_line: 50
          cursor: "cursor-1"
          truncated: false
        expected:
          status: PASS
      - name: non_canonical_bypass
        input:
          via_go: false
          revision_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          bounds:
            start_line: 1
            end_line: 50
          cursor: "cursor-1"
          truncated: false
        expected:
          status: FAIL
          error: SECURITY_REJECTED
  citation:
    fixtures:
      - name: read_includes_citations
        input:
          citations:
            - document_id: 11111111-1111-4111-8111-111111111111
              revision_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              section: "Introduction"
        expected:
          status: PASS
      - name: search_includes_citations
        input:
          citations:
            - document_id: 22222222-2222-4222-8222-222222222222
              revision_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              snippet: "..."
        expected:
          status: PASS
      - name: revoked_cursor_rejected
        input:
          citations: []
          cursor_revoked: true
        expected:
          status: FAIL
          error: AUTHZ_CONTEXT_STALE
