            approval_policy_revision: "ffffffffffffffffffffffffffffffffffffffff"
            group_epoch: 7
            revocation_epoch: 42
          stale_binding: false
          continuation: {}
        expected:
          status: FAIL
          error: STALE_INDEX_CANDIDATE
      - name: stale_policy_revision_rejected
        input:
          cursor_binding:
            snapshot_ids:
              - "11111111-1111-4111-8111-111111111111"
            profile_version: pgvector-fts-v1
            policy_bundle_id: sales-policy-bundle
            access_policy_revision: "dddddddddddddddddddddddddddddddddddddddd"
            approval_policy_revision: "ffffffffffffffffffffffffffffffffffffffff"
            group_epoch: 7
            revocation_epoch: 42
            actor_epoch: 3
          stale_binding: true
          continuation: {}
        expected:
          status: FAIL
          error: STALE_INDEX_CANDIDATE
      - name: limit_exceeded_without_next_cursor_rejected
        input:
          cursor_binding:
            snapshot_ids:
              - "11111111-1111-4111-8111-111111111111"
            profile_version: pgvector-fts-v1
            policy_bundle_id: sales-policy-bundle
            access_policy_revision: "dddddddddddddddddddddddddddddddddddddddd"
            approval_policy_revision: "ffffffffffffffffffffffffffffffffffffffff"
            group_epoch: 7
            revocation_epoch: 42
            actor_epoch: 3
          stale_binding: false
          continuation:
            limit_exceeded: true
            has_more: true
            next_cursor: null
        expected:
          status: FAIL
          error: LIMIT_EXCEEDED

  index_not_ready:
    fixtures:
      - name: no_active_snapshot_index_not_ready
        input:
          space_state: no_active_snapshot
          result:
            code: INDEX_NOT_READY
            retryable: true
        expected:
          status: PASS
      - name: inactive_preflight_index_not_ready
        input:
          space_state: inactive_preflight
          result:
            code: INDEX_NOT_READY
            retryable: true
        expected:
          status: PASS
      - name: upstream_failure_index_not_ready
        input:
          space_state: upstream_failure
          result:
            code: INDEX_NOT_READY
            retryable: true
        expected:
          status: PASS
      - name: limit_exceeded_with_cursor
        input:
          space_state: limit_exceeded
          result:
            code: LIMIT_EXCEEDED
            retryable: true
            effective_bounds:
              limit: 10
            next_cursor: "cursor-next"
            truncated: true
        expected:
          status: PASS
      - name: optimistic_success_rejected
        input:
          space_state: no_active_snapshot
          result:
            code: none
            retryable: false
        expected:
          status: FAIL
          error: INDEX_NOT_READY
      - name: silent_truncation_rejected
        input:
          space_state: limit_exceeded
          result:
            code: none
            retryable: false
            truncated: true
            next_cursor: null
        expected:
          status: FAIL
          error: LIMIT_EXCEEDED
