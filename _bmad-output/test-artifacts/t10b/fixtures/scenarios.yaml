  pointer_cas_fencing:
    fixtures:
      - name: single_writer_cas_succeeds
        input:
          current_pointer:
            fence: "00000000-0000-4000-8000-000000000000"
            snapshot_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            generation_id: gen-sales-1
            profile_version: pgvector-fts-v1
          publisher:
            expected_fence: "00000000-0000-4000-8000-000000000000"
            latest_ancestry: true
            validated_snapshot: true
            single_writer: true
          result:
            pointer_rows_updated: 1
            stale_job_marked_superseded: false
        expected:
          status: PASS
      - name: stale_fence_rejected
        input:
          current_pointer:
            fence: "11111111-1111-4111-8111-111111111111"
            snapshot_sha: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
            generation_id: gen-sales-2
            profile_version: pgvector-fts-v1
          publisher:
            expected_fence: "00000000-0000-4000-8000-000000000000"
            latest_ancestry: true
            validated_snapshot: true
            single_writer: true
          result:
            pointer_rows_updated: 0
            stale_job_marked_superseded: true
        expected:
          status: PASS
      - name: old_generation_overwrite_rejected
        input:
          current_pointer:
            fence: "22222222-2222-4222-8222-222222222222"
            snapshot_sha: "cccccccccccccccccccccccccccccccccccccccc"
            generation_id: gen-sales-3
            profile_version: pgvector-fts-v1
          publisher:
            expected_fence: "22222222-2222-4222-8222-222222222222"
            latest_ancestry: false
            validated_snapshot: true
            single_writer: true
          result:
            pointer_rows_updated: 0
            stale_job_marked_superseded: true
        expected:
          status: PASS
      - name: non_writer_publisher_rejected
        input:
          current_pointer:
            fence: "00000000-0000-4000-8000-000000000000"
            snapshot_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            generation_id: gen-sales-1
            profile_version: pgvector-fts-v1
          publisher:
            expected_fence: "00000000-0000-4000-8000-000000000000"
            latest_ancestry: true
            validated_snapshot: true
            single_writer: false
          result:
            pointer_rows_updated: 0
            stale_job_marked_superseded: false
        expected:
          status: PASS
      - name: cas_succeeds_but_rows_zero_rejected
        input:
          current_pointer:
            fence: "00000000-0000-4000-8000-000000000000"
            snapshot_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            generation_id: gen-sales-1
            profile_version: pgvector-fts-v1
          publisher:
            expected_fence: "00000000-0000-4000-8000-000000000000"
            latest_ancestry: true
            validated_snapshot: true
            single_writer: true
          result:
            pointer_rows_updated: 0
            stale_job_marked_superseded: false
        expected:
          status: FAIL
          error: INDEX_GENERATION_CONFLICT

  per_space_retrieval:
    fixtures:
      - name: active_published_snapshot_returns_citations
        input:
          snapshots:
            - state: active
              serving_allowed: true
              included: true
          candidates:
            - returned: true
              reauthorized: true
          citations:
            - space_id: sales
              document_id: "11111111-1111-4111-8111-111111111111"
              revision_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              range: "section-1"
          cross_space_leak: false
        expected:
          status: PASS
      - name: inactive_preflight_no_results
        input:
          snapshots:
            - state: ready
              serving_allowed: false
              inactive: true
              included: true
          candidates: []
          citations: []
          cross_space_leak: false
        expected:
          status: PASS
      - name: stale_snapshot_rejected
        input:
          snapshots:
            - state: superseded
              serving_allowed: false
              included: true
          candidates:
            - returned: true
              reauthorized: true
          citations: []
          cross_space_leak: false
        expected:
          status: FAIL
          error: STALE_INDEX_CANDIDATE
      - name: unauthorized_candidate_rejected
        input:
          snapshots:
            - state: active
              serving_allowed: true
              included: true
          candidates:
            - returned: true
              reauthorized: false
          citations: []
          cross_space_leak: false
        expected:
          status: FAIL
          error: AUTHZ_GROUP_STALE
      - name: cross_space_leak_rejected
        input:
          snapshots:
            - state: active
              serving_allowed: true
              included: true
          candidates:
            - returned: true
              reauthorized: true
          citations:
            - space_id: hr
              document_id: "11111111-1111-4111-8111-111111111111"
              revision_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
              range: "section-1"
          cross_space_leak: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: missing_citation_fields_rejected
        input:
          snapshots:
            - state: active
              serving_allowed: true
              included: true
          candidates:
            - returned: true
              reauthorized: true
          citations:
            - space_id: sales
              document_id: "11111111-1111-4111-8111-111111111111"
          cross_space_leak: false
        expected:
          status: FAIL
          error: SECURITY_REJECTED

  cursor_binding:
    fixtures:
      - name: complete_binding_continuation
