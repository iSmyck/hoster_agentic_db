  merge_proof:
    fixtures:
      - name: valid_merge_proof
        input:
          base_sha: ffffffffffffffffffffffffffffffffffffffff
          proposal_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          decision_id: dddddddd-dddd-4ddd-addd-dddddddddddd
          parents:
            - ffffffffffffffffffffffffffffffffffffffff
            - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          trailers:
            Decision-Id: dddddddd-dddd-4ddd-addd-dddddddddddd
          main_writes: 1
        expected:
          status: PASS
      - name: wrong_first_parent
        input:
          base_sha: ffffffffffffffffffffffffffffffffffffffff
          proposal_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          decision_id: dddddddd-dddd-4ddd-addd-dddddddddddd
          parents:
            - bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          trailers:
            Decision-Id: dddddddd-dddd-4ddd-addd-dddddddddddd
          main_writes: 1
        expected:
          status: FAIL
      - name: missing_trailer
        input:
          base_sha: ffffffffffffffffffffffffffffffffffffffff
          proposal_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          decision_id: dddddddd-dddd-4ddd-addd-dddddddddddd
          parents:
            - ffffffffffffffffffffffffffffffffffffffff
            - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          trailers: {}
          main_writes: 1
        expected:
          status: FAIL
      - name: concurrent_loser_zero_writes
        input:
          base_sha: ffffffffffffffffffffffffffffffffffffffff
          proposal_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          decision_id: dddddddd-dddd-4ddd-addd-dddddddddddd
          parents: []
          trailers: {}
          main_writes: 0
        expected:
          status: FAIL
  recovery:
    fixtures:
      - name: conclusive_failed_retry
        input:
          merge_attempted: true
          recovery_required: true
          conclusive_failed: true
          retry_allowed: true
          outcome: failed
          attempt_id: attempt-001
          new_attempt_id: attempt-002
        expected:
          status: PASS
      - name: timeout_not_conclusive
        input:
          merge_attempted: true
          recovery_required: true
          conclusive_failed: false
          retry_allowed: false
          outcome: timeout
        expected:
          status: FAIL
      - name: conflicted_terminal
        input:
          merge_attempted: true
          recovery_required: true
          conclusive_failed: false
          retry_allowed: false
          outcome: conflicted
        expected:
          status: FAIL
