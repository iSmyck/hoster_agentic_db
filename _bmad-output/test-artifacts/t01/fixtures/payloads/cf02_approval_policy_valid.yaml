schema_version: approval-policy-v1
policy_bundle_id: bundle-sales-v1
repository_id: repo-sales
space_id: sales
rules:
  - rule_id: root-rule
    path_prefix: /
    external_group_ids:
      - sales-approvers
    approvers_required: 1
    self_approval_allowed: false
  - rule_id: pricing-rule
    path_prefix: /pricing
    external_group_ids:
      - pricing-approvers
    approvers_required: 1
    self_approval_allowed: false
