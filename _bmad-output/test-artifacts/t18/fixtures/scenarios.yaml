scenarios:
  pilot_isolation:
    fixtures:
      - name: fully_isolated_pilot
        input:
          components:
            repositories_spaces: true
            config_adapters: true
            postgresql_index: true
            object_storage: true
            secrets: true
            backups: true
            egress: true
          runtime_migrations_disabled: true
          runtime_non_ddl_role: true
          migrators_only_rehearsed_upgrades: true
        expected:
          status: PASS
      - name: shared_object_storage_rejected
        input:
          components:
            repositories_spaces: true
            config_adapters: true
            postgresql_index: true
            object_storage: false
            secrets: true
            backups: true
            egress: true
          runtime_migrations_disabled: true
          runtime_non_ddl_role: true
          migrators_only_rehearsed_upgrades: true
        expected:
          status: FAIL
          error: INVALID_STATE
      - name: runtime_ddl_role_rejected
        input:
          components:
            repositories_spaces: true
            config_adapters: true
            postgresql_index: true
            object_storage: true
            secrets: true
            backups: true
            egress: true
          runtime_migrations_disabled: true
          runtime_non_ddl_role: false
          migrators_only_rehearsed_upgrades: true
        expected:
          status: FAIL
          error: SECURITY_REJECTED

  credential_egress_separation:
    fixtures:
      - name: credentials_and_egress_separated
        input:
          credentials_separated:
            proposal_merge: true
            connector: true
            ci_index: true
            retrieval: true
          default_egress_closed: true
          approved_routes_only: true
          client_code_branch: false
          production_resource_created_without_authorization: false
        expected:
          status: PASS
      - name: merge_credential_exposed_to_ci_rejected
        input:
          credentials_separated:
            proposal_merge: false
            connector: true
            ci_index: true
            retrieval: true
          default_egress_closed: true
          approved_routes_only: true
          client_code_branch: false
          production_resource_created_without_authorization: false
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: default_egress_open_rejected
        input:
          credentials_separated:
            proposal_merge: true
            connector: true
            ci_index: true
            retrieval: true
          default_egress_closed: false
          approved_routes_only: true
          client_code_branch: false
          production_resource_created_without_authorization: false
        expected:
          status: FAIL
          error: SECURITY_REJECTED
      - name: unauthorized_production_resource_rejected
        input:
          credentials_separated:
            proposal_merge: true
            connector: true
            ci_index: true
            retrieval: true
          default_egress_closed: true
          approved_routes_only: true
          client_code_branch: false
          production_resource_created_without_authorization: true
        expected:
          status: FAIL
          error: INVALID_STATE

