        input:
          decisions_assets_authorization_closure: true
          kb_authz_rebuilt: true
          kb_ops_global_merge_freeze: true
          per_target_barriers: true
          kb_index_new_validated_snapshot: true
          activation_after_snapshot_pointer: true
        expected:
