[project]
name = "corp-ai-db"
version = "0.1.0"
description = "Corporate Agentic Knowledge Base — implementation tracking and harness unit tests"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pyyaml",
    "jsonschema",
    "referencing",
    "ruff",
    "playwright>=1.65.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/identity/tests", "src/git-orchestrator/tests", "src/retrieval/tests", "src/ingestion/tests", "src/session/tests", "src/backup/tests", "src/kb-ingestion/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/git-orchestrator/**/*" = ["N999"]
"src/git-orchestrator/tests/conftest.py" = ["E402"]
"src/git-orchestrator/migrations/env.py" = ["E402"]
"src/retrieval/migrations/env.py" = ["E402"]
"src/ingestion/tests/conftest.py" = ["E402"]
"src/ingestion/migrations/env.py" = ["E402"]
"src/session/tests/conftest.py" = ["E402"]
"src/kb-ingestion/tests/conftest.py" = ["E402"]
"src/session/migrations/env.py" = ["E402"]
