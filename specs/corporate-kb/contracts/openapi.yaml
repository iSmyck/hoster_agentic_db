        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
      x-contract-invariants:
        - id: CORRECTION_CREATE_SERVER_ACTOR_OWNER
          rule: requester_stable_id, repository_id and owner are server-derived from trusted context, repository=Space binding and active approval policy. Client/LLM actor or owner fields are not accepted. document_revision_sha remains the exact reported revision.
