                - required: [number_value]
                - required: [boolean_value]
        - if:
            properties:
              value_type:
                const: number
            required: [value_type]
          then:
            required: [number_value]
            not:
              anyOf:
                - required: [string_value]
                - required: [boolean_value]
        - if:
            properties:
              value_type:
                const: boolean
            required: [value_type]
          then:
            required: [boolean_value]
            not:
              anyOf:
                - required: [string_value]
