    DocOpsCorrectionTaskResolveInput:
      type: object
      additionalProperties: false
      required: [space_id, task_id, task_version, reason, idempotency_key]
      properties:
        space_id:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
        task_id:
          type: string
