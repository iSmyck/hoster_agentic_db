    CutoverRecord:
      type: object
      additionalProperties: false
      required: [cutover_id, space_id, repository_id, cutover_sha, main_sha, validation_evidence, sign_off_actor_stable_id, timestamp, state, write_frozen, user_access_enabled]
      properties:
        cutover_id:
          type: string
          format: uuid
        space_id:
          type: string
          minLength: 1
          maxLength: 63
        repository_id:
          type: string
          minLength: 1
          maxLength: 128
        cutover_sha:
          $ref: '#/components/schemas/GitSha'
        main_sha:
          $ref: '#/components/schemas/GitSha'
        validation_evidence:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: './proposal-record.schema.json#/$defs/evidence'
        sign_off_actor_stable_id:
          $ref: '#/components/schemas/StableId'
        timestamp:
          type: string
          format: date-time
        state:
          type: string
          enum: [freeze_pending, frozen, protected, preflight, activating, activated, failed, conflicted]
        protected_tag_ref:
          type: string
          minLength: 1
          maxLength: 1024
        preflight_snapshot_id:
          type: string
          format: uuid
        preflight_run_id:
          type: string
          format: uuid
        preflight_snapshot_sha:
          $ref: '#/components/schemas/GitSha'
        preflight_validated_at:
          type: string
          format: date-time
        published_snapshot_id:
          type: string
          format: uuid
        published_run_id:
          type: string
          format: uuid
        published_snapshot_sha:
          $ref: '#/components/schemas/GitSha'
        published_validated_at:
          type: string
          format: date-time
        publication_fence:
          type: string
          minLength: 1
          maxLength: 128
          description: Current per-Space/profile CAS fence returned by the single pointer writer after same-SHA published activation.
        write_frozen:
          type: boolean
        user_access_enabled:
          type: boolean
          description: False until the validated published pointer exists and GO activates the Space; only then true.
      x-contract-invariants:
        - id: CUTOVER_RECORD_SNAPSHOT_EQUALITY
          rule: cutover_sha == main_sha == preflight_snapshot_sha == published_snapshot_sha. preflight_snapshot_id != published_snapshot_id and preflight_run_id != published_run_id. Dereferenced preflight prerequisite is a different conclusive full run in canonical ready state with preflight_validated_at, purpose=cutover_preflight/is_preflight=true/serving_allowed=false, complete closure, missing_inputs=[], and non-null exact+semantic hashes; requested/failed/empty evidence is forbidden. Dereferenced published is purpose=published/is_preflight=false/active/serving_allowed=true with published_validated_at and full validation. The preflight descriptor is never mutated into the published descriptor.
          error: INDEX_NOT_READY
      allOf:
        - if:
            properties:
              state:
                const: activated
            required: [state]
          then:
            required: [protected_tag_ref, preflight_snapshot_id, preflight_run_id, preflight_snapshot_sha, preflight_validated_at, published_snapshot_id, published_run_id, published_snapshot_sha, published_validated_at, publication_fence]
            properties:
              write_frozen:
                const: true
              user_access_enabled:
                const: true
          else:
            properties:
              user_access_enabled:
                const: false
        - if:
            properties:
              state:
                enum: [frozen, protected, preflight, activating, activated]
            required: [state]
          then:
            properties:
              write_frozen:
                const: true
        - if:
            properties:
              state:
                enum: [protected, preflight, activating, activated]
            required: [state]
          then:
            required: [protected_tag_ref]
        - if:
            properties:
              state:
                enum: [preflight, activating, activated]
            required: [state]
          then:
            required: [preflight_snapshot_id, preflight_run_id, preflight_snapshot_sha, preflight_validated_at]
        - if:
            properties:
              state:
                const: activating
            required: [state]
          then:
            required: [published_snapshot_id, published_run_id, published_snapshot_sha, published_validated_at, publication_fence]
            properties:
              user_access_enabled:
                const: false
        - if:
            required: [published_snapshot_id]
          then:
            required: [published_run_id, published_snapshot_sha, published_validated_at, publication_fence]
    WebhookInput:
      type: object
      additionalProperties: false
