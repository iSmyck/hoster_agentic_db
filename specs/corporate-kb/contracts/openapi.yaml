            required: [state]
          then:
            required: [manifest]
            not:
              required: [error]
            properties:
              manifest:
                properties:
                  closure:
                    properties:
                      complete:
                        const: true
                      decisions_complete:
                        const: true
                      assets_complete:
                        const: true
                      authorization_complete:
                        const: true
                      missing:
                        maxItems: 0
                  assets:
                    items:
                      properties:
                        export_status:
                          const: exported
                      required: [exported_object_sha256]
        - if:
            properties:
              state:
                const: incomplete
            required: [state]
          then:
            required: [manifest, error]
            properties:
              manifest:
                properties:
                  closure:
                    properties:
                      complete:
                        const: false
        - if:
            properties:
              state:
                const: failed
            required: [state]
          then:
            required: [error]
            properties:
              manifest:
                properties:
                  closure:
                    properties:
                      complete:
                        not:
                          const: true
