          type: boolean
        observed_main_sha:
          $ref: '#/components/schemas/GitSha'
        index_request_id:
          type: string
          format: uuid
    IndexPublicationInput:
      type: object
      additionalProperties: false
      required: [expected_publication_fence, expected_active_snapshot_id, expected_latest_main_sha]
      properties:
        expected_publication_fence:
          type: string
          minLength: 1
          maxLength: 128
        expected_active_snapshot_id:
          type: [string, 'null']
          format: uuid
        expected_latest_main_sha:
          $ref: '#/components/schemas/GitSha'
      description: Atomic CAS predicate evaluated by the single writer under the per-Space/profile publication lock. A stale fence, active pointer, ancestry, or validated run updates zero rows.
    IndexRunStatusInput:
      type: object
      additionalProperties: false
      required: [run_id, space_id, snapshot_sha, main_generation_id, index_profile_version, state, idempotency_key]
      properties:
        run_id:
          type: string
          format: uuid
        space_id:
          type: string
          minLength: 1
          maxLength: 63
        snapshot_sha:
          $ref: '#/components/schemas/GitSha'
        main_generation_id:
          type: string
          minLength: 1
          maxLength: 128
        index_profile_version:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum: [requested, resolving, building, validating, ready, active, superseded, failed, dead_letter]
        snapshot:
          $ref: './index-snapshot.schema.json'
        publication:
          $ref: '#/components/schemas/IndexPublicationInput'
        error:
          $ref: '#/components/schemas/Error'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
      x-contract-invariants:
        - id: INDEX_CALLBACK_PUBLICATION_EQUALITY
          rule: snapshot_sha == publication.expected_latest_main_sha == snapshot.snapshot_sha; body generation/profile/Space match snapshot and run. The active descriptor has purpose=published, preflight.is_preflight=false, serving_allowed=true, ready hashes, complete closure, and rewrite/full or incremental-equivalence proof. Ready/active incremental requires nonempty closure.equivalence_evidence for a distinct conclusive ready/active full run+snapshot with validated_at, same perimeter/SHA/profile/closure hash and empty missing inputs; requested/failed/empty prerequisites are rejected. CAS failure returns rejected_stale and writes zero pointer rows.
          error: INDEX_GENERATION_CONFLICT
      allOf:
        - if:
            properties:
              state:
                enum: [ready, active]
            required: [state]
          then:
            required: [snapshot]
        - if:
            properties:
              state:
                const: ready
            required: [state]
          then:
            properties:
              snapshot:
                properties:
                  state:
                    const: ready
        - if:
            properties:
              state:
                const: active
            required: [state]
          then:
            required: [publication]
            properties:
              snapshot:
                properties:
                  purpose:
                    const: published
                  state:
                    const: active
                  preflight:
                    properties:
                      is_preflight:
                        const: false
                      serving_allowed:
                        const: true
        - if:
            properties:
              state:
                not:
                  const: active
            required: [state]
          then:
            not:
              required: [publication]
    IndexRunStatusResult:
      type: object
      additionalProperties: false
      required: [accepted, deduplicated]
      properties:
        accepted:
          type: boolean
        deduplicated:
          type: boolean
        publication_state:
          type: string
          enum: [not_applicable, published, rejected_stale]
        publication_fence:
          type: string
          minLength: 1
          maxLength: 128
