openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Corporate KB GO API
  version: 0.3.0-proposed
  description: >-
    PROPOSED собственный контракт GO под логическим префиксом /api/kb/v1. Это не Open WebUI upstream API и не описание непроверенных GitLab routes. T00 DONE и G0 APPROVED: baseline Git object format SHA-1 и synthetic GitLab webhook delivery с configured secret подтверждены PASS; production webhook allowlist и product adapter mapping, upstream session/CSRF/service-credential mappings, conformance и production integration checks остаются ADAPTER-REQUIRED/UNKNOWN по соответствующему scope, а не blanket T00 UNKNOWN. Серверный trusted AuthzContext обязателен для каждого вызова; ни один request schema не принимает actor, groups или tenant как доказательство.
x-contract-status: PROPOSED
x-mutation-idempotency: Every mutating operation requires Idempotency-Key bound to authenticated actor, normalized route, and normalized payload SHA-256. Before insertion GO performs a global key-registry lookup across actors and routes; replay with a different actor, route, concrete path, or payload returns IDEMPOTENCY_KEY_REUSED with zero writes.
x-contract-invariants:
  - id: PATH_BODY_SPACE_ID
    operations: [proposeCreateDocument, createImportDryRun, commitImport, createSpaceExport, applySpaceCutover, readLiveOperational, createDocOpsCorrectionTask, resolveDocOpsCorrectionTask, cancelDocOpsCorrectionTask]
    rule: path.space_id == body.space_id and the trusted per-Space AuthzContext repository/policy binding; validate before any side effect.
    error: VALIDATION_ERROR
    alternative_denials:
      - condition: mismatch is confirmed inside an already authorized object scope
        error: VALIDATION_ERROR
      - condition: returning object existence or mismatch details would violate anti-enumeration policy
        error: NOT_FOUND
  - id: PATH_BODY_DOCUMENT_ID
    operations: [saveDocumentDraft, proposeEditDocument, proposeWholeDocumentEdit, proposeDocumentRestore]
    rule: path.document_id == body.document_id and the authorized document UUID in the exact base revision; validate before any side effect.
    error: VALIDATION_ERROR
    alternative_denials:
      - condition: mismatch is confirmed inside an already authorized object scope
        error: VALIDATION_ERROR
      - condition: returning object existence or mismatch details would violate anti-enumeration policy
        error: NOT_FOUND
  - id: PATH_BODY_PROPOSAL_ID
    operations: [editProposalVersion, applyProposalDecision]
    rule: path.proposal_id == body.proposal_id == decision/proposal record proposal_id in the path Space/repository; validate before any side effect.
    error: VALIDATION_ERROR
    alternative_denials:
      - condition: mismatch is confirmed inside an already authorized object scope
        error: VALIDATION_ERROR
      - condition: returning object existence or mismatch details would violate anti-enumeration policy
        error: NOT_FOUND
  - id: PATH_BODY_IMPORT_ID
    operations: [commitImport]
    rule: path.import_id == body.import_id and path.space_id == body.space_id == dry-run manifest Space; the manifest hash binds the same import.
    error: VALIDATION_ERROR
    alternative_denials:
      - condition: mismatch is confirmed inside an already authorized object scope
        error: VALIDATION_ERROR
      - condition: returning object existence or mismatch details would violate anti-enumeration policy
        error: NOT_FOUND
  - id: PATH_BODY_RUN_ID
    operations: [reportIndexRunStatus]
    rule: path.run_id == body.run_id and the callback belongs to the same run, Space, repository, generation, profile, and snapshot; validate before status writes.
    error: VALIDATION_ERROR
  - id: BODY_HEADER_IDEMPOTENCY
    operations: [saveDocumentDraft, proposeCreateDocument, proposeEditDocument, proposeWholeDocumentEdit, editProposalVersion, applyProposalDecision, proposeDocumentRestore, createImportDryRun, commitImport, createSpaceExport, applySpaceCutover, ingestGitLabWebhook, reportIndexRunStatus, createDocOpsCorrectionTask, resolveDocOpsCorrectionTask, cancelDocOpsCorrectionTask]
    rule: body.idempotency_key == Idempotency-Key header. The global key registry compares verified actor, normalized operation/route, concrete path parameters, and normalized payload before insert or side effect.
    error: IDEMPOTENCY_KEY_REUSED
  - id: DECISION_KEY_AND_PROPOSAL_EQUALITY
    operations: [applyProposalDecision]
    rule: decision_id == body.idempotency_key == Idempotency-Key header; path.proposal_id == body.proposal_id; expected_proposal_sha/base_sha equal the reviewed immutable version.
    error: VALIDATION_ERROR
  - id: PATH_BODY_CORRECTION_TASK_ID
    operations: [resolveDocOpsCorrectionTask, cancelDocOpsCorrectionTask]
    rule: path.task_id == body.task_id and path.space_id == body.space_id == task.space_id; validate against the authorized task before any event or projection write.
    error: VALIDATION_ERROR
    alternative_denials:
      - condition: mismatch is confirmed inside an already authorized object scope
        error: VALIDATION_ERROR
      - condition: returning object existence or mismatch details would violate anti-enumeration policy
        error: NOT_FOUND
  - id: CORRECTION_TASK_LIFECYCLE_AND_CAS
    operations: [createDocOpsCorrectionTask, resolveDocOpsCorrectionTask, cancelDocOpsCorrectionTask]
    rule: Only open/in_review/resolved/cancelled states and contracted transitions are allowed. Create returns open, or in_review only with a durable valid linked MR. Resolve/cancel require the current task_version; resolved/cancelled are terminal and reopen is forbidden. Identical replay returns the existing record with zero new events.
    error: INVALID_STATE
  - id: CORRECTION_TASK_EVIDENCE_HASH
    operations: [createDocOpsCorrectionTask, resolveDocOpsCorrectionTask, cancelDocOpsCorrectionTask]
    rule: evidence_sha256 equals SHA-256 of JCS UTF-8 for the closed sanitized evidence object. Create always requires it; no-MR resolve and every cancel require reason plus new evidence. Raw evidence is never returned or logged as ordinary telemetry.
    error: VALIDATION_ERROR
  - id: CORRECTION_TASK_GOVERNED_MR_OUTCOME
    operations: [createDocOpsCorrectionTask, resolveDocOpsCorrectionTask]
    rule: linked_mr belongs to the same Space/repository and exact ProposalVersion. MR-based resolution requires merge_commit_sha plus verified ProposalRecord/canonical human DecisionRecord/GO merge evidence. No-MR resolution records disposition only and never claims canonical correction. Task operations never edit or archive canonical content.
    error: REVISION_CONFLICT
  - id: AGENT_RESTRICTED_WRITE_SCHEMA
    operations: [proposeCreateDocument, proposeEditDocument]
    rule: boundedAgentCredential may use only the closed body-only create/patch schemas. It cannot invoke editProposalVersion, whole-document replacement, merge, decisions, grants, archive, restore, import commit, export, cutover, or attachment management. GO independently rejects forbidden diffs and credentials on every channel.
    error: FORBIDDEN
  - id: CONNECTOR_POST_CUTOVER_PROPOSAL_ONLY
    operations: [createImportDryRun, commitImport]
    rule: connectorCredential is bound to authorized source bindings. Dry-run has canonical_writes=false; commit is permitted only in post_cutover_proposal mode. Connector cannot select pre_cutover_controlled staging, merge, grants, index writes, or another Space/binding.
    error: FORBIDDEN
  - id: SEARCH_PER_SPACE_SNAPSHOTS
    operations: [searchDocuments]
    rule: Fan out only to requested Spaces present in trusted AuthzContext. Each result and cursor page preserves the full per-Space snapshot/repository/policy bundle/revisions/group snapshot/revocation epoch/profile set. No global or borrowed snapshot is allowed; every item's space_id/snapshot_id and citation match its descriptor.
    error: AUTHZ_CONTEXT_STALE
  - id: INDEX_STATUS_SNAPSHOT_BINDING
    operations: [reportIndexRunStatus]
    rule: body.snapshot_sha/main_generation_id/index_profile_version equal the corresponding snapshot fields. Active requires a non-preflight published descriptor and publication CAS evidence; preflight can never be active or serving.
    error: INDEX_GENERATION_CONFLICT
  - id: CUTOVER_SAME_SNAPSHOT_ACTIVATION
    operations: [applySpaceCutover]
    rule: Activated records dereference distinct preflight/published run and snapshot IDs with cutover_sha=main_sha=preflight_snapshot_sha=published_snapshot_sha. Preflight is full/ready/non-serving; published is a new fully validated non-preflight purpose=published active descriptor. Pointer CAS uses the current per-Space/profile publication fence.
    error: INDEX_NOT_READY
  - id: EXPORT_READY_COMPLETE
    operations: [createSpaceExport, getSpaceExport]
    rule: state=ready requires a manifest with closure.complete=decisions_complete=assets_complete=authorization_complete=true, missing=[], all assets exported, and decision/note/tag/hash/outcome closure. Missing/rejected assets or incomplete batches require incomplete or failed, never ready.
    error: INVALID_STATE
  - id: RESOLVED_LINK_DOCUMENT_ID
    operations: [getDocumentLinks, listDocuments, readDocument]
    rule: Every resolved link's target_document_id equals the UUID of the target document projection in the same Space and exact snapshot; source_document_id equals the path/document UUID. Swapped, orphan, and cycle states are not resolved.
    error: INVALID_STRUCTURE
  - id: LIVE_OPERATIONAL_TYPED_READ_ONLY
    operations: [readLiveOperational]
    rule: path.space_id == body.space_id and path.source_binding_id == body.source_binding_id. Only registered typed operations and bounded filters are allowed. Response has snapshot_time and immutable source version/hash; canonical_writes, proposal_cursor_effects, and index_writes are false. No wiki/MR/document/seen/proposed/merged cursor is created.
    error: INVALID_STATE
servers:
  - url: /api/kb/v1
    description: Logical GO prefix only; no deployment endpoint is selected.
tags:
  - name: documents
  - name: proposals
  - name: retrieval
  - name: imports
  - name: exports
  - name: cutover
  - name: integrations
  - name: sources
  - name: docops
paths:
  /spaces/{space_id}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      security:
        - browserSession: []
        - boundedAgentCredential: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - name: parent_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized page from one repository=Space snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        default:
          $ref: '#/components/responses/Error'
  /documents/{document_id}:
    get:
      operationId: readDocument
      tags: [documents]
      security:
        - browserSession: []
        - boundedAgentCredential: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: revision_sha
          in: query
          schema:
            $ref: '#/components/schemas/GitSha'
        - name: section
          in: query
          description: Opaque section selector previously returned by the API; heading structure is not parsed by the client.
          schema:
            type: string
            maxLength: 2048
        - $ref: '#/components/parameters/Cursor'
        - name: max_chars
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200000
            default: 20000
      responses:
        '200':
          description: Canonical whole/section read with explicit bounds and truncation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRead'
        default:
          $ref: '#/components/responses/Error'
  /documents/{document_id}/links:
    get:
      operationId: getDocumentLinks
      tags: [documents]
      security:
        - browserSession: []
        - boundedAgentCredential: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: revision_sha
          in: query
          schema:
            $ref: '#/components/schemas/GitSha'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized stable-ID links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLinks'
        default:
          $ref: '#/components/responses/Error'
  /documents/{document_id}/history:
    get:
      operationId: listDocumentHistory
      tags: [documents]
      description: Bounded ACL-filtered canonical Git history for business restore/revert-MR. Protected objects use NOT_FOUND anti-enumeration; no GitLab user is required.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Exact revision page with ancestry and explicit continuation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentHistoryPage'
        default:
          $ref: '#/components/responses/Error'
  /documents/{document_id}/drafts:
    post:
      operationId: saveDocumentDraft
      tags: [documents]
      description: Human draft autosave to a branch; main is unchanged. Agent flows use propose operations instead.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftSaveInput'
      responses:
        '200':
          description: Existing idempotent draft result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftView'
        '201':
          description: Durable draft created on exact base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftView'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/proposals:
    post:
      operationId: proposeCreateDocument
      tags: [proposals]
      description: Single-page create through GO branch+MR+ProposalRecord; never a direct main write.
      security:
        - browserSession: []
          csrfToken: []
        - boundedAgentCredential: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeCreateDocumentInput'
      responses:
        '201':
          description: ProposalVersion and append-only ProposalRecord.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        '200':
          description: Existing proposal returned for the same idempotency context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        default:
          $ref: '#/components/responses/Error'
  /documents/{document_id}/proposals:
    post:
      operationId: proposeEditDocument
      tags: [proposals]
      description: Single-page edit from exact base SHA. Ambiguous patches and stale bases perform zero canonical writes.
      security:
        - browserSession: []
          csrfToken: []
        - boundedAgentCredential: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeEditDocumentInput'
      responses:
        '201':
          description: ProposalVersion and append-only ProposalRecord.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        '200':
          description: Existing idempotent proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        default:
          $ref: '#/components/responses/Error'
  /documents/{document_id}/replacement-proposals:
    post:
      operationId: proposeWholeDocumentEdit
      tags: [proposals]
      description: Human-only whole-document replacement including reviewed front matter and attachment changes. Bounded agents are forbidden and must use the restricted body-only patch operation.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanWholeDocumentEditInput'
      responses:
        '201':
          description: Human ProposalVersion with complete front matter/link/attachment review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        '200':
          description: Existing idempotent proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/review-proposals:
    get:
      operationId: listReviewProposals
      tags: [proposals]
      description: Bounded group-assigned approver queue. Server derives groups and longest-normalized-prefix rule from fresh per-Space policy context; no GitLab user or caller-supplied authority is accepted.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - name: path_prefix
          in: query
          description: Optional narrowing prefix; it cannot widen the effective rule or Space scope.
          schema:
            type: string
            minLength: 1
            maxLength: 513
            pattern: '^/[^\\u0000-\\u001F\\\\]*$'
            not:
              pattern: '(?:^|/)\.\.(?:/|$)'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Exact ProposalVersions assigned to current external groups, with per-Space policy/group evidence and truncation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePage'
        default:
          $ref: '#/components/responses/Error'
  /proposals/{proposal_id}:
    get:
      operationId: getProposal
      tags: [proposals]
      security:
        - browserSession: []
        - boundedAgentCredential: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - name: proposal_sha
          in: query
          description: Optional exact version selector; omission returns the current authorized version.
          schema:
            $ref: '#/components/schemas/GitSha'
      responses:
        '200':
          description: Exact diff, preview reliability, principals, rationale, evidence, and decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        default:
          $ref: '#/components/responses/Error'
  /proposals/{proposal_id}/versions:
    post:
      operationId: editProposalVersion
      tags: [proposals]
      description: Human-only creation of a new immutable ProposalVersion and ProposalRecord. Previous approval is invalid. Agents must create a new single-page proposal through the restricted propose operations and cannot edit an existing proposal version.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalVersionInput'
      responses:
        '201':
          description: New proposal SHA and version author; old approval is not inherited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        default:
          $ref: '#/components/responses/Error'
  /proposals/{proposal_id}/decisions:
    post:
      operationId: applyProposalDecision
      tags: [proposals]
      description: Human-only accept/reject/cancel. accepted executes the GO merge protocol; agent and connector credentials are never allowed. Idempotency-Key must equal decision_id.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCommand'
      responses:
        '200':
          description: Existing Git-derived result or durable reject/cancel outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '202':
          description: Decision is durable but merge outcome is pending or quarantined; this is not merged success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        default:
          $ref: '#/components/responses/Error'
  /documents/{document_id}/restore-proposals:
    post:
      operationId: proposeDocumentRestore
      tags: [proposals]
      description: Human revert-MR/new commit workflow; history is never rewritten.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreProposalInput'
      responses:
        '201':
          description: Restore proposal created for human review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalView'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/docops/review-queue:
    get:
      operationId: listDocOpsReviewQueue
      tags: [docops]
      description: Bounded ACL-filtered queue for expired, scheduled, and active DocOps reviews projected from canonical valid_until. Expiry never grants access or archives automatically.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - name: review_state
          in: query
          schema:
            type: string
            enum: [scheduled, due, in_review]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Exact revision-bound DocOps metadata with per-Space policy/group evidence and truncation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocOpsReviewQueuePage'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/docops/correction-tasks:
    post:
      operationId: createDocOpsCorrectionTask
      tags: [docops]
      description: Create a GO-owned docops-correction-task-v1 on an exact reported document revision. Requester/repository/owner are server-derived. The task never edits canonical content. Initial state is open, or in_review with a durable valid linked MR.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocOpsCorrectionTaskCreateInput'
      responses:
        '201':
          description: New exact-revision correction task with policy-derived owner.
          content:
            application/json:
              schema:
                $ref: './docops-correction-task.schema.json'
        '200':
          description: Existing result returned for an identical idempotent replay without a second side effect.
          content:
            application/json:
              schema:
                $ref: './docops-correction-task.schema.json'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/docops/correction-tasks/{task_id}:
    get:
      operationId: getDocOpsCorrectionTask
      tags: [docops]
      description: Freshly authorized task/state/owner/exact-revision/evidence-hash/linked-MR view. Raw evidence payload is not returned; another Space receives safe NOT_FOUND/FORBIDDEN according to policy.
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/CorrectionTaskId'
      responses:
        '200':
          description: Current closed correction-task record.
          content:
            application/json:
              schema:
                $ref: './docops-correction-task.schema.json'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/docops/correction-tasks/{task_id}/resolve:
    post:
      operationId: resolveDocOpsCorrectionTask
      tags: [docops]
      description: Owner-only CAS resolution. MR-based resolution requires verified governed ProposalRecord/canonical human DecisionRecord/GO merge evidence. No-MR resolution requires reason plus evidence hash and does not claim canonical correction.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/CorrectionTaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocOpsCorrectionTaskResolveInput'
      responses:
        '200':
          description: Terminal resolved task or existing result for identical replay.
          content:
            application/json:
              schema:
                $ref: './docops-correction-task.schema.json'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/docops/correction-tasks/{task_id}/cancel:
    post:
      operationId: cancelDocOpsCorrectionTask
      tags: [docops]
      description: Policy-authorized requester/owner cancellation with task_version CAS, reason and evidence hash. Canonical content is unchanged; cancelled is terminal.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/CorrectionTaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocOpsCorrectionTaskCancelInput'
      responses:
        '200':
          description: Terminal cancelled task or existing result for identical replay.
          content:
            application/json:
              schema:
                $ref: './docops-correction-task.schema.json'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/sources/{source_binding_id}/cursor:
    get:
      operationId: getSourceSyncCursor
      tags: [sources]
      description: Read one managed source cursor within the authorized binding. live_operational has no cursor and returns INVALID_STATE; no cursor is exposed across Spaces.
      security:
        - browserSession: []
        - connectorCredential: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - name: source_binding_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: source_object_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        '200':
          description: Durable seen/proposed/merged state for a non-live source binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSyncCursor'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/live-operational/{source_binding_id}/read:
    post:
      operationId: readLiveOperational
      tags: [sources]
      description: Read-only typed operation on a registered live_operational binding. It never creates a wiki page, proposal, index entry, or source cursor and is not an arbitrary source query.
      security:
        - browserSession: []
        - connectorCredential: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - name: source_binding_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveOperationalReadInput'
      responses:
        '200':
          description: Bounded typed facts with snapshot_time and no canonical/cursor/index effects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveOperationalReadResult'
        default:
          $ref: '#/components/responses/Error'
  /retrieval/search:
    post:
      operationId: searchDocuments
      tags: [retrieval]
      description: Read-only exact or semantic bounded search with per-Space authorization and fan-out. Every response/cursor chain preserves the complete set of active per-Space snapshots, profiles, policy bundles, revisions, group snapshots, and revocation epochs.
      security:
        - browserSession: []
        - boundedAgentCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchDocumentsInput'
      responses:
        '200':
          description: Authorized candidates; stale or revoked candidates are rejected before payload exposure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/index/active:
    get:
      operationId: getActiveIndexSnapshot
      tags: [retrieval]
      security:
        - browserSession: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      responses:
        '200':
          description: Current active published index descriptor; never an inactive preflight.
          content:
            application/json:
              schema:
                $ref: './index-snapshot.schema.json'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/imports/dry-runs:
    post:
      operationId: createImportDryRun
      tags: [imports]
      description: Creates only bounded staging/report artifacts; no branch, MR, main commit, active index entry, or merged cursor.
      security:
        - browserSession: []
          csrfToken: []
        - internalCICredential: []
        - connectorCredential: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDryRunInput'
      responses:
        '201':
          description: Deterministic path-to-ID/provenance/links/assets/errors manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportManifest'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/imports/{import_id}/commit:
    post:
      operationId: commitImport
      tags: [imports]
      description: Commits a validated dry-run into the applicable GO workflow. After cutover this always creates an MR for human merge; controlled bulk staging is available only to authorized browser/engineering flow before cutover. Connector credential is restricted to its source binding and post_cutover_proposal mode.
      security:
        - browserSession: []
          csrfToken: []
        - connectorCredential: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - name: import_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitInput'
      responses:
        '201':
          description: Post-cutover proposal or pre-cutover controlled staging result; not an automatic publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitResult'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/exports:
    post:
      operationId: createSpaceExport
      tags: [exports]
      description: Human privileged full clone+manifests operation with fresh group/export/history authorization on every batch.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportInput'
      responses:
        '202':
          description: Export job accepted; no payload is returned before closure and authorization validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        default:
          $ref: '#/components/responses/Error'
  /exports/{export_id}:
    get:
      operationId: getSpaceExport
      tags: [exports]
      security:
        - browserSession: []
      parameters:
        - name: export_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status and, only when complete, the full export manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        default:
          $ref: '#/components/responses/Error'
  /spaces/{space_id}/cutover:
    post:
      operationId: applySpaceCutover
      tags: [cutover]
      description: Privileged resumable cutover state machine. It starts with write freeze and HEAD==cutover_sha; success requires protections, inactive preflight, published pointer, then Space activation.
      security:
        - browserSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CutoverCommand'
      responses:
        '200':
          description: Existing cutover state for the same Space+SHA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutoverRecord'
        '202':
          description: Cutover is incomplete; user access remains closed until activation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutoverRecord'
        default:
          $ref: '#/components/responses/Error'
  /integrations/gitlab/webhooks:
    post:
      operationId: ingestGitLabWebhook
      tags: [integrations]
      description: PROPOSED normalized GO intake boundary, not an asserted upstream GitLab route/header contract. T00 synthetic webhook delivery with configured secret is PASS; production reachable allowlist and the product authenticity/replay/field adapter mapping remain ADAPTER-REQUIRED/UNKNOWN as applicable. The adapter must verify authenticity and replay before trusting actor/event identity.
      security:
        - webhookCredential: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '202':
          description: Verified event accepted/deduplicated; Git state is read separately before CI dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        default:
          $ref: '#/components/responses/Error'
  /internal/index-runs/{run_id}/events:
    post:
      operationId: reportIndexRunStatus
      tags: [integrations]
      description: Internal CI-only status mutation. CI cannot move main, merge, alter grants, or directly expose an index snapshot for retrieval.
      security:
        - internalCICredential: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRunStatusInput'
      responses:
        '200':
          description: Status accepted or deduplicated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRunStatusResult'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: kb_browser_session
      description: PROPOSED logical placeholder for the upstream authenticated session. T00 static session seams are confirmed; the actual Open WebUI cookie/session mapping is ADAPTER-REQUIRED and production integration is not claimed. Anonymous managed access is forbidden.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: PROPOSED own-GO CSRF contract for browser mutations. T00 static audit found no sufficient app-level CSRF/Origin control in the stock auth/approval path, so the adapter is ADAPTER-REQUIRED; concrete header/token issuance remains UNKNOWN until that adapter is implemented and must not weaken server checks.
    boundedAgentCredential:
      type: http
      scheme: bearer
      bearerFormat: bounded-agent-capability
      description: Separate least-privilege server-issued agent credential with read/search/propose only. It has no merge, grants, shell, generic SQL, arbitrary Git/filesystem, export, Tool Creation, or arbitrary Python capability.
    connectorCredential:
      type: http
      scheme: bearer
      bearerFormat: source-connector-proposal-capability
      description: Separate source-binding-scoped connector identity for immutable dry-run, post-cutover proposals, typed source reads, and cursor reads. It is neither browser nor agent credential and has no merge, grant, pre-cutover bulk, arbitrary query, or index-write capability.
    internalCICredential:
      type: http
      scheme: bearer
      bearerFormat: internal-ci-capability
      description: Separate CI/index credential limited to exact-main reads, approved index work, and status callbacks. It is not an agent or merge credential.
    webhookCredential:
      type: apiKey
      in: header
      name: X-KB-Webhook-Credential
      description: PROPOSED logical webhook credential header. T00 synthetic webhook delivery with configured secret is PASS; exact production secret/signature/replay field mapping is ADAPTER-REQUIRED and production allowlist/network details remain UNKNOWN. Secrets exist only in deployment secret storage and are never represented in schemas/examples.
  parameters:
    SpaceId:
      name: space_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CorrectionTaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable across retries of the same actor+route+payload. For proposal decisions it must equal decision_id. Never replace it to mask an uncertain merge outcome.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      description: Opaque bounded server cursor tied to query, scope, snapshot/profile, and authorization revision. It grants no independent permission.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Error:
      description: Sanitized machine-readable error. Anti-enumeration uses NOT_FOUND where disclosure of existence is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    GitSha:
      type: string
      pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
      description: Full lowercase Git object ID; no short SHA. T00 baseline repository object format is SHA-1 (40 hex), confirmed; the optional 64-hex form is forward compatibility only and is not a selected alternate baseline.
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    StableId:
      type: string
      minLength: 1
      maxLength: 512
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          enum: [NOT_FOUND, FORBIDDEN, STALE_BASE, PROPOSAL_VERSION_MISMATCH, PATCH_AMBIGUOUS, INVALID_STRUCTURE, INVALID_STATE, UPSTREAM_UNAVAILABLE, LIMIT_EXCEEDED, IDEMPOTENCY_KEY_REUSED, POLICY_REVISION_MISMATCH, DECISION_INVALID, RECOVERY_REQUIRED, AUTHZ_CONTEXT_STALE, GROUP_SNAPSHOT_STALE, IDENTITY_UNAVAILABLE, APPROVER_CONFLICT, INVALID_POLICY, INDEX_NOT_READY, STALE_INDEX_CANDIDATE, INDEX_GENERATION_CONFLICT, REVISION_CONFLICT, DEPENDENCY_CLOSURE_MISMATCH, PROFILE_MISMATCH, SECURITY_REJECTED, PII_REVIEW_REQUIRED, UNSUPPORTED_FORMAT, EXTRACTION_LOSS, OUTSTANDING_PROPOSAL_EXISTS, CURATED_CONFLICT, SOURCE_GONE, CSRF_REJECTED, WEBHOOK_REJECTED, VALIDATION_ERROR]
        message:
          type: string
          minLength: 1
          maxLength: 2000
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: object
          maxProperties: 32
          additionalProperties:
            type: [string, number, boolean, 'null']
          description: Optional sanitized scalar metadata only; no raw private content, secrets, or provider payloads.
        retryable:
          type: boolean
          description: Never infer merge absence from retryable/timeout. RECOVERY_REQUIRED requires reconciliation, not blind retry.
    Truncation:
      type: object
      additionalProperties: false
      required: [truncated, reason, next_cursor]
      properties:
        truncated:
          type: boolean
        reason:
          type: string
          enum: [none, item_limit, character_limit, byte_limit, snapshot_boundary]
        next_cursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 4096
          pattern: '^[A-Za-z0-9_-]+$'
      allOf:
        - if:
            properties:
              truncated:
                const: false
            required: [truncated]
          then:
            properties:
              reason:
                const: none
              next_cursor:
                type: 'null'
        - if:
            properties:
              truncated:
                const: true
            required: [truncated]
          then:
            properties:
              reason:
                enum: [item_limit, character_limit, byte_limit, snapshot_boundary]
              next_cursor:
                type: string
    Section:
      type: object
      additionalProperties: false
      required: [heading_path, occurrence]
      properties:
        heading_path:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 512
        anchor:
          type: string
          minLength: 1
          maxLength: 256
        occurrence:
          type: integer
          minimum: 1
          maximum: 1000
    DocumentSummary:
      type: object
      additionalProperties: false
      required: [document_id, space_id, parent_id, title, path, ownership_mode, state, document_revision_sha, archived]
      properties:
        document_id:
          type: string
          format: uuid
        space_id:
          type: string
          minLength: 1
          maxLength: 63
        parent_id:
          type: [string, 'null']
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 512
        path:
          type: string
          minLength: 1
          maxLength: 1024
        ownership_mode:
          type: string
          enum: [migrated, source_managed, curated]
        state:
          type: string
          enum: [draft, in_review, published, indexed, archived, conflicted]
        document_revision_sha:
          $ref: '#/components/schemas/GitSha'
        archived:
          type: boolean
    DocumentList:
      type: object
      additionalProperties: false
      required: [items, snapshot_sha, limit, truncation]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DocumentSummary'
        snapshot_sha:
          $ref: '#/components/schemas/GitSha'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        truncation:
          $ref: '#/components/schemas/Truncation'
    DocumentHistoryEntry:
      type: object
      additionalProperties: false
      required: [document_id, revision_sha, parent_shas, root, committed_at, current]
      properties:
        document_id:
          type: string
          format: uuid
        revision_sha:
          $ref: '#/components/schemas/GitSha'
        parent_shas:
          type: array
          minItems: 0
          maxItems: 2
          items:
            $ref: '#/components/schemas/GitSha'
        root:
          type: boolean
          description: True only after server verification that the Git commit has zero parents. Non-root revisions have one or two parent SHAs.
        committed_at:
          type: string
          format: date-time
        author_stable_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 512
        proposal_id:
          type: string
          minLength: 1
          maxLength: 128
        current:
          type: boolean
          description: True only for the exact history_head_sha revision; ordering follows Git ancestry, never SHA sorting.
      allOf:
        - if:
            properties:
              root:
                const: true
            required: [root]
          then:
            properties:
              parent_shas:
                maxItems: 0
        - if:
            properties:
              root:
                const: false
            required: [root]
          then:
            properties:
              parent_shas:
                minItems: 1
    DocumentHistoryPage:
      type: object
      additionalProperties: false
      required: [document_id, history_head_sha, items, limit, truncation]
      properties:
        document_id:
          type: string
          format: uuid
        history_head_sha:
          $ref: '#/components/schemas/GitSha'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DocumentHistoryEntry'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        truncation:
          $ref: '#/components/schemas/Truncation'
      x-contract-invariants:
        - id: DOCUMENT_HISTORY_EXACT_REVISION
          rule: Every item.document_id equals the path/page document_id; current=true iff revision_sha=history_head_sha. Cursor binds that document and head. root=true is permitted only after Git verifies zero parents and requires parent_shas=[]; root=false requires one or two verified parents. parent_shas and ordering come from Git ancestry, and restore creates a revert-MR from the selected exact revision without history rewrite.
          error: REVISION_CONFLICT
    ListDocumentsInput:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id:
          type: string
          minLength: 1
          maxLength: 63
        parent_id:
          type: string
          format: uuid
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[A-Za-z0-9_-]+$'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    DocumentRead:
      type: object
      additionalProperties: false
      required: [document_id, document_revision_sha, path, content, content_format, historical, truncation]
      properties:
        document_id:
          type: string
          format: uuid
        document_revision_sha:
          $ref: '#/components/schemas/GitSha'
        path:
          type: string
          minLength: 1
          maxLength: 1024
        section:
          $ref: '#/components/schemas/Section'
        content:
          type: string
          maxLength: 200000
        content_format:
          type: string
          enum: [markdown_with_front_matter, markdown_fragment]
        front_matter:
          $ref: './front-matter.schema.json'
        historical:
          type: boolean
          description: Explicit historical reads are authorized and labelled; stale retrieval never silently sets this fallback.
        truncation:
          $ref: '#/components/schemas/Truncation'
    ReadDocumentInput:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id:
          type: string
          format: uuid
        revision_sha:
          $ref: '#/components/schemas/GitSha'
        section:
          $ref: '#/components/schemas/Section'
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[A-Za-z0-9_-]+$'
        max_chars:
          type: integer
          minimum: 1
          maximum: 200000
          default: 20000
    SearchScope:
      type: object
      additionalProperties: false
      description: Client scope can only narrow the server-issued effective AuthzContext.
      properties:
        space_ids:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 63
        document_ids:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uuid
        subtree:
          type: object
          additionalProperties: false
          required: [space_id, path_prefix]
          properties:
            space_id:
              type: string
              minLength: 1
              maxLength: 63
            path_prefix:
              type: string
              minLength: 1
              maxLength: 513
              pattern: '^/[^\\u0000-\\u001F\\\\]*$'
              not:
                pattern: '(?:^|/)\.\.(?:/|$)'
    SearchDocumentsInput:
      type: object
      additionalProperties: false
      required: [query, mode]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2048
        mode:
          type: string
          enum: [exact, semantic]
        scope:
          $ref: '#/components/schemas/SearchScope'
        cursor:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[A-Za-z0-9_-]+$'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    GroupSnapshotDescriptor:
      type: object
      additionalProperties: false
      required: [snapshot_id, captured_at, membership_sha256]
      properties:
        snapshot_id:
          type: string
          format: uuid
        captured_at:
          type: string
          format: date-time
        membership_sha256:
          $ref: '#/components/schemas/Sha256'
    PerSpaceAuthorization:
      type: object
      additionalProperties: false
      required: [space_id, repository_id, policy_bundle_id, access_policy_revision, approval_policy_revision, group_snapshot, revocation_epoch]
      properties:
        space_id:
          type: string
          minLength: 1
          maxLength: 63
        repository_id:
          type: string
          minLength: 1
          maxLength: 128
        policy_bundle_id:
          type: string
          minLength: 1
          maxLength: 256
        access_policy_revision:
          $ref: '#/components/schemas/GitSha'
        approval_policy_revision:
          $ref: '#/components/schemas/GitSha'
        group_snapshot:
          $ref: '#/components/schemas/GroupSnapshotDescriptor'
        revocation_epoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    SnapshotDescriptor:
      type: object
      additionalProperties: false
      required: [authorization, snapshot_id, snapshot_sha, main_generation_id, index_profile_version]
      properties:
        authorization:
          $ref: '#/components/schemas/PerSpaceAuthorization'
        snapshot_id:
          type: string
          format: uuid
        snapshot_sha:
          $ref: '#/components/schemas/GitSha'
        main_generation_id:
          type: string
          minLength: 1
          maxLength: 128
        index_profile_version:
          type: string
          minLength: 1
          maxLength: 128
    SearchResult:
      type: object
      additionalProperties: false
      required: [space_id, document_id, document_revision_sha, snapshot_id, snapshot_sha, match_mode, section, citation]
      properties:
        space_id:
          type: string
          minLength: 1
          maxLength: 63
        document_id:
          type: string
          format: uuid
        document_revision_sha:
          $ref: '#/components/schemas/GitSha'
        snapshot_id:
          type: string
          format: uuid
        snapshot_sha:
          $ref: '#/components/schemas/GitSha'
        match_mode:
          type: string
          enum: [exact, semantic]
        score:
          type: number
          minimum: 0
          maximum: 1
        section:
          $ref: '#/components/schemas/Section'
        snippet:
          type: string
          maxLength: 4000
          description: Returned only after fresh payload authorization.
        citation:
          type: object
          additionalProperties: false
          required: [space_id, document_id, document_revision_sha, section]
          properties:
            space_id:
              type: string
              minLength: 1
              maxLength: 63
            document_id:
              type: string
              format: uuid
            document_revision_sha:
              $ref: '#/components/schemas/GitSha'
            section:
