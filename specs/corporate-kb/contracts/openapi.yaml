    ImportCommitResult:
      type: object
      additionalProperties: false
      required: [import_id, mode, status]
      properties:
        import_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [pre_cutover_controlled, post_cutover_proposal]
        status:
          type: string
          enum: [staged_pre_cutover, proposal_created, no_op]
        proposal:
          $ref: '#/components/schemas/ProposalView'
        staging_package_ref:
          type: string
          minLength: 1
          maxLength: 2048
        existing_result_ref:
          type: string
          minLength: 1
          maxLength: 2048
          description: Required for no_op; references the prior staging result or outstanding proposal without claiming a new write.
      allOf:
        - if:
            properties:
              mode:
                const: pre_cutover_controlled
            required: [mode]
          then:
            properties:
              status:
                enum: [staged_pre_cutover, no_op]
        - if:
            properties:
              mode:
                const: post_cutover_proposal
            required: [mode]
          then:
            properties:
              status:
                enum: [proposal_created, no_op]
        - if:
            properties:
              status:
                const: staged_pre_cutover
            required: [status]
          then:
            required: [staging_package_ref]
            not:
              required: [proposal]
        - if:
            properties:
              status:
                const: proposal_created
            required: [status]
          then:
            required: [proposal]
            not:
              required: [staging_package_ref]
        - if:
            properties:
              status:
                const: no_op
            required: [status]
          then:
            required: [existing_result_ref]
            not:
              anyOf:
                - required: [proposal]
                - required: [staging_package_ref]
