        - id: CORRECTION_CANCEL_AUTHORIZED_ACTOR
          rule: Only the policy-authorized requester or current owner may cancel from open/in_review with the current task_version. cancelled is terminal and canonical content is unchanged.
          error: FORBIDDEN
    SourceSyncCursor:
      type: object
      additionalProperties: false
      required: [source_binding_id, source_object_id, space_id, repository_id, ownership_mode, sync_state, seen_version, seen_hash, proposed_version, proposed_hash, outstanding_proposal_id, outstanding_proposal_sha, merged_version, merged_hash, merge_commit_sha, merge_verified]
      properties:
        source_binding_id:
          type: string
          minLength: 1
          maxLength: 128
        source_object_id:
          type: string
          minLength: 1
          maxLength: 512
        space_id:
          type: string
          minLength: 1
          maxLength: 63
        repository_id:
          type: string
          minLength: 1
          maxLength: 128
        document_id:
          type: string
          format: uuid
        ownership_mode:
          type: string
          enum: [migrated, source_managed, curated]
        sync_state:
          type: string
          enum: [observed, seen_durable, no_op, proposal_pending, merged, rejected, conflicted, tombstone, retry, dead_letter]
        seen_version:
          type: [string, 'null']
          minLength: 1
          maxLength: 512
        seen_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        proposed_version:
          type: [string, 'null']
          minLength: 1
          maxLength: 512
        proposed_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        outstanding_proposal_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        outstanding_proposal_sha:
          type: [string, 'null']
          pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
        merged_version:
          type: [string, 'null']
          minLength: 1
          maxLength: 512
        merged_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        merge_commit_sha:
          type: [string, 'null']
          pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
        merge_verified:
          type: boolean
      x-contract-invariants:
        - id: SOURCE_CURSOR_HASH_PAIRS
          rule: (seen_version IS NULL) iff (seen_hash IS NULL), (proposed_version IS NULL) iff (proposed_hash IS NULL), and (merged_version IS NULL) iff (merged_hash IS NULL). proposal_pending requires proposed version+hash and outstanding proposal ID+SHA. merged requires merged version+hash+merge_commit_sha, merge_verified=true, and outstanding_proposal_id/outstanding_proposal_sha=null. Every state other than proposal_pending clears both outstanding fields; rejected/cancelled/terminal replay does not reuse a completed proposal as outstanding. merge_commit_sha is present only for sync_state=merged with a verified Git-derived merge. live_operational cannot be represented in this cursor contract.
          error: INVALID_STATE
      allOf:
        - if:
            properties:
              sync_state:
                const: proposal_pending
            required: [sync_state]
          then:
            properties:
              outstanding_proposal_id:
                type: string
              outstanding_proposal_sha:
                type: string
              proposed_version:
                type: string
              proposed_hash:
                type: string
              merge_verified:
                const: false
        - if:
            properties:
              sync_state:
                const: merged
            required: [sync_state]
          then:
            required: [merge_commit_sha]
            properties:
              merged_version:
                type: string
              merged_hash:
                type: string
              merge_verified:
                const: true
              outstanding_proposal_id:
                type: 'null'
              outstanding_proposal_sha:
                type: 'null'
        - if:
            properties:
              sync_state:
                not:
                  const: merged
            required: [sync_state]
          then:
            properties:
              merge_verified:
                const: false
              merge_commit_sha:
                type: 'null'
        - if:
            properties:
              sync_state:
                not:
                  const: proposal_pending
            required: [sync_state]
          then:
            properties:
              outstanding_proposal_id:
                type: 'null'
              outstanding_proposal_sha:
                type: 'null'
        - if:
            properties:
              seen_version:
                type: string
            required: [seen_version]
          then:
            properties:
              seen_hash:
                type: string
        - if:
            properties:
              seen_version:
                type: 'null'
            required: [seen_version]
          then:
            properties:
              seen_hash:
                type: 'null'
        - if:
            properties:
              proposed_version:
                type: string
            required: [proposed_version]
          then:
            properties:
              proposed_hash:
                type: string
        - if:
            properties:
              proposed_version:
                type: 'null'
            required: [proposed_version]
          then:
            properties:
              proposed_hash:
                type: 'null'
        - if:
            properties:
              merged_version:
                type: string
            required: [merged_version]
          then:
            properties:
              merged_hash:
                type: string
        - if:
            properties:
              merged_version:
                type: 'null'
            required: [merged_version]
          then:
            properties:
              merged_hash:
                type: 'null'
    LiveOperationalFilter:
      type: object
