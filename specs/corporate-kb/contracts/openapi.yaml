          maxLength: 10000
        evidence:
          type: array
          maxItems: 64
          items:
            $ref: './proposal-record.schema.json#/$defs/evidence'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
    ProposalView:
      type: object
      additionalProperties: false
      required: [record, state, diff, preview_reliable, decisions]
      properties:
        record:
          $ref: './proposal-record.schema.json'
        state:
          type: string
          enum: [draft, in_review, conflicted, rejected, cancelled, published, archived, superseded]
        diff:
          type: object
          additionalProperties: false
          required: [complete, changed_paths, includes_front_matter, includes_links, includes_attachments]
          properties:
            complete:
              type: boolean
            changed_paths:
              type: array
              maxItems: 1024
              items:
                type: string
                minLength: 1
                maxLength: 1024
            includes_front_matter:
              type: boolean
            includes_links:
              type: boolean
            includes_attachments:
              type: boolean
        preview_reliable:
          type: boolean
          description: False blocks merge even when a textual diff exists.
        decisions:
          type: array
          maxItems: 1024
          items:
            $ref: './decision-record.schema.json'
    GetProposalInput:
      type: object
      additionalProperties: false
      required: [proposal_id]
      properties:
        proposal_id:
          type: string
          minLength: 1
          maxLength: 128
        proposal_sha:
          $ref: '#/components/schemas/GitSha'
    DecisionCommand:
      type: object
      additionalProperties: false
      required: [decision_id, proposal_id, expected_proposal_sha, base_sha, action, rationale, evidence, idempotency_key]
      properties:
        decision_id:
          type: string
          format: uuid
        proposal_id:
          type: string
          minLength: 1
          maxLength: 128
        expected_proposal_sha:
          $ref: '#/components/schemas/GitSha'
        base_sha:
          $ref: '#/components/schemas/GitSha'
        action:
          type: string
          enum: [accepted, rejected, cancelled]
        rationale:
          type: string
          minLength: 1
          maxLength: 10000
        evidence:
          type: array
          maxItems: 64
          items:
            $ref: './proposal-record.schema.json#/$defs/evidence'
        idempotency_key:
          type: string
          format: uuid
          description: Must equal decision_id and the Idempotency-Key header.
    DecisionAttempt:
      type: object
      additionalProperties: false
      required: [attempt_id, request_state, no_merge_proven, reconciliation_evidence]
      properties:
        attempt_id:
          type: string
          format: uuid
        request_state:
          type: string
          enum: [prepared, in_flight, completed, unknown]
        no_merge_proven:
          type: boolean
        reconciliation_evidence:
          type: array
          maxItems: 64
          items:
            $ref: './proposal-record.schema.json#/$defs/evidence'
      allOf:
        - if:
            properties:
              no_merge_proven:
                const: true
            required: [no_merge_proven]
          then:
            properties:
              request_state:
                const: completed
        - if:
            properties:
              request_state:
                enum: [prepared, in_flight, unknown]
            required: [request_state]
          then:
            properties:
              no_merge_proven:
                const: false
    DecisionResult:
      type: object
      additionalProperties: false
      required: [decision, state, attempts, reconciliation_evidence, recovery_required, target_quarantined, retryable]
      properties:
        decision:
          $ref: './decision-record.schema.json'
        state:
          type: string
          enum: [recorded, merge_attempted, merged, failed, conflicted, invalid]
          description: Canonical projection states are preserved. Quarantine is merge_attempted plus recovery_required=true and target_quarantined=true, not a substitute state.
        attempts:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/DecisionAttempt'
          description: Only real durable merge_operations, ordered oldest to newest. Empty before the first accepted merge transaction and for rejected/cancelled actions; no synthetic no-merge attempt is created.
        note:
          $ref: './export-manifest.schema.json#/$defs/noteExport'
        tag:
          $ref: './export-manifest.schema.json#/$defs/decisionTagExport'
        reconciliation_evidence:
          type: array
          maxItems: 64
          items:
            $ref: './proposal-record.schema.json#/$defs/evidence'
          description: Decision-level recovery or verified MR-closure evidence independent of merge attempts. May be empty during the recorded accepted crash window.
        merge_proof:
          $ref: './export-manifest.schema.json#/$defs/mergeExport'
        recovery_required:
          type: boolean
        target_quarantined:
          type: boolean
        retryable:
          type: boolean
          description: True only for conclusive failed after request completion and proven no-merge. A replay never creates an attempt; guarded recovery retry uses the same decision_id after fresh preconditions. conflicted and invalid are terminal.
      x-contract-invariants:
        - id: DECISION_RESULT_REPLAY_AND_RETRY
          rule: Same decision_id plus identical command is read-only and returns one current Git-derived outcome. Only a recovery coordinator may transition conclusive failed to a new merge_attempted attempt with the same decision_id, fresh preconditions, request_state=completed and no_merge_proven=true. Unknown outcomes remain merge_attempted/quarantined with retryable=false; conflicted and invalid never retry.
          error: RECOVERY_REQUIRED
        - id: DECISION_RESULT_REAL_ATTEMPTS_ONLY
          rule: attempts[] maps one-to-one to real durable merge_operations for action=accepted and is ordered oldest to newest; the last attempt drives the current attempt outcome. recorded accepted and every rejected/cancelled action have attempts=[] and never synthesize request_state or no_merge_proven. A recorded accepted crash window may have recovery_required/target_quarantined=true with no no-merge claim. Normal rejected/cancelled closure uses decision-level reconciliation_evidence instead.
          error: INVALID_STATE
        - id: DECISION_RESULT_MERGE_LINKAGE
          rule: For state=merged, decision.action=accepted and merge_proof.first_parent_sha=decision.base_sha, second_parent_sha=decision.proposal_sha. merge_proof.merge_commit_sha is verified by GO in decision.repository_id/decision.target_branch first-parent ancestry and its raw bytes match commit_content_sha256. trailers.Decision-ID=decision.decision_id, Decision-Note-ID=note.note_id, Decision-Hash=decision.record_sha256=note.record_sha256, Approved-by=decision.actor_stable_id. note.proposal_id=decision.proposal_id; tag.ref_name='refs/tags/kb-decisions/'+decision.decision_id and tag.target_proposal_sha=decision.proposal_sha. note.canonical_json_sha256=tag.canonical_json_sha256=SHA-256(JCS UTF-8 of complete decision including record_sha256). target_ancestry_verified=note_tag_hash_verified=true is backed by actual Git verification, not a caller assertion. The same semantic rule is shared with EXPORT_MERGE_LINKAGE and EXPORT_DECISION_NOTE_TAG_RECORD_LINKAGE.
          error: DECISION_INVALID
      allOf:
        - if:
            properties:
              state:
                const: merged
            required: [state]
          then:
            required: [merge_proof, note, tag]
            properties:
              decision:
                properties:
                  action:
                    const: accepted
              recovery_required:
                const: false
              target_quarantined:
                const: false
              retryable:
                const: false
              attempts:
                minItems: 1
                contains:
                  properties:
                    request_state:
                      const: completed
                    no_merge_proven:
                      const: false
        - if:
            properties:
              state:
                not:
                  const: merged
            required: [state]
          then:
            not:
              required: [merge_proof]
        - if:
            properties:
              state:
                const: merge_attempted
            required: [state]
          then:
            properties:
              decision:
                properties:
                  action:
                    const: accepted
              recovery_required:
                const: true
              target_quarantined:
                const: true
              retryable:
                const: false
              attempts:
                minItems: 1
                contains:
                  properties:
                    request_state:
                      enum: [prepared, in_flight, completed, unknown]
                    no_merge_proven:
                      const: false
        - if:
            properties:
              state:
                const: failed
            required: [state]
          then:
            properties:
              decision:
                properties:
                  action:
                    const: accepted
              recovery_required:
                const: false
              target_quarantined:
                const: false
              attempts:
                minItems: 1
                contains:
                  properties:
                    request_state:
                      const: completed
                    no_merge_proven:
                      const: true
                    reconciliation_evidence:
                      minItems: 1
        - if:
            properties:
              state:
                const: conflicted
            required: [state]
          then:
            properties:
              decision:
                properties:
                  action:
                    const: accepted
              recovery_required:
                const: false
              target_quarantined:
                const: false
              retryable:
                const: false
              attempts:
                minItems: 1
                contains:
                  properties:
                    request_state:
                      const: completed
                    no_merge_proven:
                      const: true
                    reconciliation_evidence:
                      minItems: 1
        - if:
            properties:
              state:
                const: invalid
            required: [state]
          then:
            properties:
              retryable:
                const: false
        - if:
            properties:
              state:
                const: recorded
            required: [state]
          then:
            properties:
              retryable:
                const: false
        - if:
            properties:
              state:
                const: recorded
              decision:
                properties:
                  action:
                    const: accepted
                required: [action]
            required: [state, decision]
          then:
            properties:
              attempts:
                maxItems: 0
        - if:
            properties:
              state:
                const: invalid
              attempts:
                contains:
                  properties:
                    no_merge_proven:
                      const: false
                minItems: 1
            required: [state, attempts]
          then:
            properties:
              recovery_required:
                const: true
              target_quarantined:
                const: true
        - if:
            properties:
              decision:
                properties:
                  action:
                    enum: [rejected, cancelled]
                required: [action]
            required: [decision]
          then:
            properties:
              state:
                enum: [recorded, invalid]
              attempts:
                maxItems: 0
        - if:
            properties:
              state:
                const: recorded
              decision:
                properties:
                  action:
                    enum: [rejected, cancelled]
                required: [action]
            required: [state, decision]
          then:
            properties:
              recovery_required:
                const: false
              target_quarantined:
                const: false
              retryable:
                const: false
              reconciliation_evidence:
                minItems: 1
    RestoreProposalInput:
