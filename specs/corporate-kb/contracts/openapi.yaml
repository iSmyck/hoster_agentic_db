        task_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 10000
        linked_mr:
          allOf:
            - $ref: './docops-correction-task.schema.json#/$defs/linkedMR'
            - type: object
              properties:
                merge_commit_sha:
                  $ref: '#/components/schemas/GitSha'
        evidence:
          $ref: './docops-correction-task.schema.json#/$defs/evidencePayload'
        evidence_sha256:
          $ref: '#/components/schemas/Sha256'
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
      allOf:
        - if:
            not:
              required: [linked_mr]
          then:
            required: [evidence, evidence_sha256]
            description: No-MR resolution requires reason and evidence; it records disposition only, not canonical correction.
      x-contract-invariants:
        - id: CORRECTION_RESOLVE_OWNER_AND_OUTCOME
          rule: Only the current policy owner may resolve from open/in_review with the current task_version. Linked-MR resolution requires a verified governed merge; no-MR resolution requires reason plus evidence. resolved is terminal.
          error: INVALID_STATE
    DocOpsCorrectionTaskCancelInput:
      type: object
      additionalProperties: false
      required: [space_id, task_id, task_version, reason, evidence, evidence_sha256, idempotency_key]
      properties:
