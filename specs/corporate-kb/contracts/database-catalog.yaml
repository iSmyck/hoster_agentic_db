        classification: operational
        retention: {policy: inherit_index_snapshot, rule: "Пересоздаётся с каждым snapshot; closure evidence по owner index retention."}
        security: "No raw linked content; cross-Space targets запрещены same-snapshot composite FK и contracts."
        columns:
          dependency_id: {type: uuid, nullable: false}
          snapshot_id: {type: uuid, nullable: false}
          space_id: {type: text, nullable: false}
          dependent_document_projection_id: {type: uuid, nullable: false}
          dependency_key: {type: text, nullable: false}
          dependency_kind: {type: text, nullable: false}
          target_document_projection_id: {type: uuid, nullable: true}
          target_attachment_projection_id: {type: uuid, nullable: true}
          target_hash: {type: text, nullable: false}
          transitive: {type: boolean, nullable: false}
          closure_hash: {type: text, nullable: false}
          created_at: {type: timestamptz, nullable: false}
        primary_key: [dependency_id]
        foreign_keys:
          - columns: [dependent_document_projection_id, snapshot_id, space_id]
            references: {schema: kb_index, table: documents, columns: [document_projection_id, snapshot_id, space_id]}
            on_delete: restrict
          - columns: [target_document_projection_id, snapshot_id, space_id]
            references: {schema: kb_index, table: documents, columns: [document_projection_id, snapshot_id, space_id]}
            on_delete: restrict
          - columns: [target_attachment_projection_id, snapshot_id, space_id]
            references: {schema: kb_index, table: attachments, columns: [attachment_projection_id, snapshot_id, space_id]}
            on_delete: restrict
        uniques:
          - columns: [dependent_document_projection_id, dependency_key]
        checks:
          - macro: sha256
            columns: [target_hash, closure_hash]
          - macro: nonempty
            columns: [dependency_key]
          - expression: "dependency_kind IN ('document','attachment','shared_policy','shared_metadata')"
          - expression: "(dependency_kind = 'document' AND target_document_projection_id IS NOT NULL AND target_attachment_projection_id IS NULL) OR (dependency_kind = 'attachment' AND target_attachment_projection_id IS NOT NULL AND target_document_projection_id IS NULL) OR (dependency_kind IN ('shared_policy','shared_metadata') AND target_document_projection_id IS NULL AND target_attachment_projection_id IS NULL)"
        indexes:
          - columns: [target_document_projection_id]
          - columns: [target_attachment_projection_id]
          - columns: [closure_hash]
          - columns: [dependency_kind]
      chunks:
        purpose: "Eligible published section/chunk и exact-search projection с citation bounds."
        canonical_source: "Eligible Git document + dependencies; chunk text производный, не canonical original."
        rebuildable: true
        rebuild_strategy: "Deterministic chunking profile; stale candidates отклоняются по active snapshot/document revision."
        classification: private_projection
        retention: {policy: inherit_index_snapshot_profile, rule: "Revocation действует до reindex; old chunks по owner snapshot/profile retention."}
        security: "Retrieval read-only + fresh AuthZ до exposure; raw chunks не пишутся в logs/audit/eval export."
        columns:
          chunk_id: {type: uuid, nullable: false}
          snapshot_id: {type: uuid, nullable: false}
          space_id: {type: text, nullable: false}
          document_projection_id: {type: uuid, nullable: false}
          profile_id: {type: uuid, nullable: false}
          chunk_ordinal: {type: integer, nullable: false}
          section_path: {type: text, nullable: false}
          heading_path: {type: jsonb, nullable: false}
          start_offset: {type: integer, nullable: false}
          end_offset: {type: integer, nullable: false}
          content_text: {type: text, nullable: false}
          content_hash: {type: text, nullable: false}
          dependency_hash: {type: text, nullable: false}
          token_count: {type: integer, nullable: true}
          search_vector: {type: tsvector, nullable: true, status: candidate_t00}
          created_at: {type: timestamptz, nullable: false}
        primary_key: [chunk_id]
        foreign_keys:
          - columns: [document_projection_id, snapshot_id, space_id]
            references: {schema: kb_index, table: documents, columns: [document_projection_id, snapshot_id, space_id]}
            on_delete: restrict
          - columns: [profile_id]
            references: {schema: kb_index, table: index_profiles, columns: [profile_id]}
            on_delete: restrict
          - columns: [snapshot_id, space_id, profile_id]
            references: {schema: kb_index, table: snapshots, columns: [snapshot_id, space_id, profile_id]}
            on_delete: restrict
        uniques:
          - columns: [document_projection_id, profile_id, chunk_ordinal]
          - columns: [chunk_id, snapshot_id, space_id, profile_id]
        checks:
          - macro: sha256
            columns: [content_hash, dependency_hash]
          - expression: "chunk_ordinal >= 0"
          - expression: "start_offset >= 0 AND end_offset >= start_offset"
          - expression: "token_count IS NULL OR token_count >= 0"
        indexes:
          - columns: [space_id, snapshot_id, profile_id]
          - columns: [content_hash]
          - columns: [search_vector]
            method: gin
            status: candidate_t00
      embeddings:
        purpose: "Semantic projection metadata; pgvector/vector candidate без фиксированной dimension до T00."
        canonical_source: "Chunk + approved model/profile/config; embedding rebuildable."
        rebuildable: true
        rebuild_strategy: "Approved inference/offline assets без unplanned fallback или проверенный immutable backend snapshot; paid calls отдельно авторизуются."
        classification: private_projection
        retention: {policy: inherit_index_snapshot_profile, rule: "Shadow profile не заменяет live до validation; old vectors по owner retention."}
        security: "Vectors защищаются как private chunks; no provider credentials; external_ref не cross-schema FK."
        columns:
          embedding_id: {type: uuid, nullable: false}
          chunk_id: {type: uuid, nullable: false}
          snapshot_id: {type: uuid, nullable: false}
          space_id: {type: text, nullable: false}
          profile_id: {type: uuid, nullable: false}
          provider_model_id: {type: text, nullable: false}
          dimensions: {type: integer, nullable: false, status: value_unknown_t00}
          storage_backend: {type: text, nullable: false}
          vector_value: {type: vector, nullable: true, status: candidate_t00, dimensions: not_fixed_t00}
          external_ref: {type: text, nullable: true, reference_kind: supported_backend_locator_not_fk}
          vector_hash: {type: text, nullable: true}
          created_at: {type: timestamptz, nullable: false}
        primary_key: [embedding_id]
        foreign_keys:
          - columns: [chunk_id, snapshot_id, space_id, profile_id]
            references: {schema: kb_index, table: chunks, columns: [chunk_id, snapshot_id, space_id, profile_id]}
            on_delete: restrict
        uniques:
          - columns: [chunk_id, profile_id, provider_model_id, dimensions]
        checks:
          - macro: sha256
            columns: [vector_hash]
          - macro: nonempty
            columns: [provider_model_id, storage_backend]
          - expression: "dimensions > 0"
          - expression: "num_nonnulls(vector_value, external_ref) = 1"
        indexes:
          - columns: [space_id, snapshot_id, profile_id]
          - columns: [storage_backend, external_ref]
          - columns: [vector_value]
            method: ann_t00
            candidate_methods: [hnsw, ivfflat]
            status: proposed_until_acl_aware_recall_benchmark
      publication_fences:
        purpose: "Durable publication lock/fence register per Space/profile для CAS всех generations этого pointer."
        canonical_source: "CI publication journal + Git ancestry; fence является operational safety state, не canonical content."
        rebuildable: false
        rebuild_strategy: "После потери БД создаётся fresh fence под global publication freeze; pointer пересоздаётся только после full validation."
        classification: operational
        retention: {policy: space_profile_pointer_lifecycle, rule: "Fence сохраняется на lifecycle Space/profile; lock expiry не разрешает stale publication."}
        security: "Только dedicated pointer publisher; generation отсутствует в lock key, поэтому old/new generations сериализуются вместе."
        columns:
          space_id: {type: text, nullable: false}
          profile_id: {type: uuid, nullable: false}
          repository_id: {type: text, nullable: false}
          fencing_token: {type: bigint, nullable: false}
          lock_owner_id: {type: text, nullable: true}
          lock_acquired_at: {type: timestamptz, nullable: true}
          lock_expires_at: {type: timestamptz, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [space_id, profile_id]
        foreign_keys:
          - columns: [profile_id]
            references: {schema: kb_index, table: index_profiles, columns: [profile_id]}
            on_delete: restrict
        uniques:
          - columns: [space_id, profile_id, repository_id]
        checks:
          - macro: nonempty
            columns: [space_id, repository_id]
          - expression: "fencing_token > 0"
        indexes:
          - columns: [repository_id, fencing_token]
      active_pointers:
        purpose: "Единственный active published non-preflight pointer per Space/profile с full-perimeter FK и CAS fencing."
        canonical_source: "Git ancestry + fully validated published run; pointer не canonical content source."
        rebuildable: true
        rebuild_strategy: "Не восстанавливать из непроверенного backup как истину; создать заново после full validated run и fresh fence."
        classification: operational
        retention: {policy: active_pointer_lifecycle, rule: "History в runs/snapshots; старый pointer атомарно superseded; late generation не публикуется."}
        security: "Один writer; retrieval read-only; preflight snapshot/run никогда не имеет active pointer."
        columns:
          space_id: {type: text, nullable: false}
          profile_id: {type: uuid, nullable: false}
          snapshot_id: {type: uuid, nullable: false}
          generation_id: {type: uuid, nullable: false}
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          snapshot_sha: {type: text, nullable: false}
          purpose: {type: text, nullable: false}
          is_preflight: {type: boolean, nullable: false}
          serving_allowed: {type: boolean, nullable: false}
          snapshot_state: {type: text, nullable: false}
          pointer_state: {type: text, nullable: false}
          publication_owner_id: {type: text, nullable: false}
          fencing_token: {type: bigint, nullable: false}
          activated_at: {type: timestamptz, nullable: false}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [space_id, profile_id]
        foreign_keys:
          - columns: [space_id, profile_id, repository_id]
            references: {schema: kb_index, table: publication_fences, columns: [space_id, profile_id, repository_id]}
            on_delete: restrict
          - columns: [snapshot_id, space_id, repository_id, target_branch, snapshot_sha, generation_id, profile_id, purpose, is_preflight, serving_allowed, snapshot_state]
            references: {schema: kb_index, table: snapshots, columns: [snapshot_id, space_id, repository_id, target_branch, snapshot_sha, generation_id, profile_id, purpose, is_preflight, serving_allowed, state]}
            on_delete: restrict
        uniques:
          - columns: [snapshot_id]
        checks:
          - macro: git_sha
            columns: [snapshot_sha]
          - macro: nonempty
            columns: [publication_owner_id]
          - expression: "purpose = 'published' AND NOT is_preflight AND serving_allowed AND snapshot_state = 'active'"
          - expression: "pointer_state = 'active'"
          - expression: "fencing_token > 0"
        indexes:
          - columns: [pointer_state]
          - columns: [generation_id, profile_id]
          - columns: [snapshot_sha]
      index_errors:
        purpose: "Bounded retry и DLQ для index runs без private payload."
        canonical_source: "Exact Git/assets/config failure input; CI run владеет retry semantics."
        rebuildable: false
        rebuild_strategy: "Error history disposable; full rebuild и HEAD reconciliation создают новые errors/DLQ; poison input не активируется."
        classification: operational
        retention: {policy: index_error_owner_decision, rule: "DLQ сохраняется до resolution, затем owner retention."}
        security: "No raw documents, query text, model response, secrets или PII snippets."
        columns:
          error_id: {type: uuid, nullable: false}
          run_id: {type: uuid, nullable: true}
          snapshot_id: {type: uuid, nullable: true}
          space_id: {type: text, nullable: true}
          repository_id: {type: text, nullable: true}
          target_branch: {type: text, nullable: true}
          stage: {type: text, nullable: false}
          subject_type: {type: text, nullable: false}
          subject_key_hash: {type: text, nullable: false}
          dedupe_key: {type: text, nullable: false}
          error_code: {type: text, nullable: false}
          sanitized_message: {type: text, nullable: false}
          details: {type: jsonb, nullable: false}
          retryable: {type: boolean, nullable: false}
          attempt_count: {type: integer, nullable: false}
          state: {type: text, nullable: false}
          first_seen_at: {type: timestamptz, nullable: false}
          last_seen_at: {type: timestamptz, nullable: false}
          next_attempt_at: {type: timestamptz, nullable: true}
          dead_lettered_at: {type: timestamptz, nullable: true}
          resolved_at: {type: timestamptz, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [error_id]
        foreign_keys:
          - columns: [run_id, space_id, repository_id, target_branch]
            references: {schema: kb_index, table: index_runs, columns: [run_id, space_id, repository_id, target_branch]}
            on_delete: restrict
          - columns: [snapshot_id, run_id, space_id, repository_id, target_branch]
            references: {schema: kb_index, table: snapshots, columns: [snapshot_id, run_id, space_id, repository_id, target_branch]}
            on_delete: restrict
        uniques:
          - columns: [dedupe_key]
        checks:
          - macro: sha256
            columns: [subject_key_hash]
          - macro: nonempty
            columns: [stage, subject_type, dedupe_key, error_code, sanitized_message]
          - expression: "attempt_count >= 0"
          - expression: "state IN ('open','retry_scheduled','dead_letter','resolved')"
          - expression: "(run_id IS NULL AND snapshot_id IS NULL) OR (space_id IS NOT NULL AND repository_id IS NOT NULL AND target_branch IS NOT NULL)"
          - expression: "snapshot_id IS NULL OR run_id IS NOT NULL"
          - expression: "state <> 'dead_letter' OR dead_lettered_at IS NOT NULL"
          - expression: "state <> 'resolved' OR resolved_at IS NOT NULL"
        indexes:
          - columns: [state, next_attempt_at]
          - columns: [run_id, stage]
          - columns: [space_id, state]
canonical_projection_mappings:
  version: canonical-projection-mapping-v1
  authz_context:
    contract: authz-context-v2
    envelope: "authz_contexts хранит context_id/issuer/stable_id/actor_type/actor revocation_epoch/evaluated_at/expires_at; top-level policy/groups не восстанавливаются."
    per_space: "Каждый space_scopes[] entry ↔ authz_context_spaces(context_id,space_id) со своими repository/policy revisions/group_snapshot/membership_sha256/groups/path_scopes/revocation_epoch."
    validated_inputs: "Composite FK требует policy_validation_state=valid и group_snapshot_status=ready; issuer+context_evaluated_at совпадают с parent, group snapshot ID/captured_at/membership_hash/revocation_epoch совпадают с parent snapshot. Pending/invalid/building/failed/superseded inputs запрещены."
    principals: "Membership/grant registry mode использует composite FK identity+issuer+stable_id; external_only до JIT хранит canonical issuer+stable_id с NULL identity_id. Personal exception только subject_type=identity+reason; group_policy только group+ready same-issuer snapshot, без GitLab users."
    fanout: "Search/tool/export fan-out обязан выбрать binding того же Space; parent context не содержит reusable bundle для чужого Space."
  decision_record:
    contract: decision-record-v1
    fields:
      action: "accepted→accept; rejected→reject; cancelled→cancel; обратный mapping только по таблице, без substring normalization."
      actor_type: "human→actor_type='human'; service/agent/connector DecisionRecord запрещены."
      timestamp: decided_at
      request_id: request_id
      payload_hash: payload_hash
      rationale_and_evidence: "rationale/evidence сохраняются одноимёнными columns; schema_version=decision-record-v1 constant, record_sha256 вычисляется по JCS без hash field."
      proposal_version: "(proposal_id,proposal_sha,base_sha,space_id,repository_id,target_branch) связывает DecisionRecord с immutable ProposalVersion и его proposal_version_id."
      anchors: "note_id/tag_name/tag_object_sha/tag_target_sha являются GitLab anchors; tag_target_sha=proposal_sha. record_sha256 исключает hash field, canonical_json_sha256 хеширует полный JSON, note_body_sha256 и tag_message_sha256 не подменяют друг друга."
    result_states:
      recorded: "Accept/reject/cancel recorded имеют attempts=[] и не получают synthetic merge_operation. Accept crash после note/tag до DB восстанавливается recorded+unresolved barrier+recovery flags=true; у всех recorded no_merge_proven отсутствует. Note/tag не доказывает no-call/no-merge. Reject/cancel используют mr_closure_evidence и не создают merge operation."
      merge_attempted: "Accept merge_attempted имеет nonempty attempts[] из реальных merge_operations in_flight/completed/unknown, без merge proof: recovery_required=true, target_quarantined=true, retryable=false."
      quarantined: "Derived UI по recovery flags, не новый canonical state: обычно merge_attempted+barrier, но crash-reconstructed recorded также может иметь recovery_required=true+target_quarantined=true."
      merged: "Decision merged + полный merge proof + target-wide barrier cleared: recovery_required=false, target_quarantined=false; чужой unresolved accept запрещает terminal response до target-wide clear."
      failed: "Decision failed + attempt verified_not_merged + request_completed + no-merge evidence + target-wide barrier cleared: recovery_required=false, target_quarantined=false; guarded retry возможен."
      conflicted: "Terminal Git-derived conflict + verified_not_merged + request_completed + target-wide barrier cleared; retryable=false, новый reviewed ProposalVersion обязателен."
      invalid: "Terminal evidence classification; при merge_outcome=unknown barrier/link и оба recovery flags остаются true, retryable=false; только proven outcome позволяет clear."
    barrier_flags: "recovery_required=target_barriers.recovery_required; target_quarantined=true для merge_attempted или unresolved/unknown/quarantined link, включая crash-reconstructed recorded. Merged/failed/conflicted возвращаются как terminal только после target-wide clear; recorded с unresolved link не утверждает false recovery."
    retryable: "Computed, не stored: только failed + доказанные no-merge/request completion + fresh preconditions + same decision/target; guarded retry создаёт новый attempt и атомарно восстанавливает barrier, identical HTTP replay создаёт zero attempts; conflicted/invalid всегда false."
    attempt_fields: "attempts[] — упорядоченные по attempt_no реальные merge_operations; recorded accepted/rejected/cancelled → attempts=[], без synthetic UUID. merge_attempted/failed/conflicted требуют реальные attempts. prepared→prepared, call_inflight→in_flight, unknown+request_completed=false→unknown, unknown+request_completed=true→completed, verified_* / conflicted→completed."
    no_merge_proven: "Не выводится из note/tag или attempts=[]: у recorded accepted/rejected/cancelled и crash reconstruction поле отсутствует. Оно появляется только в реальных attempts: failed/conflicted требуют verified_not_merged+request_completed; reject/cancel используют decision-level closure evidence."
    integrity: "recorded/merge_attempted/merged/failed/conflicted требуют полный note/tag/object/target+three hashes; failed/conflicted без них → invalid+missing_integrity; mismatch → invalid+mismatched_integrity, unknown outcome сохраняет quarantine."
    export_outcomes: "rejected/cancelled+recorded+verified close→rejected/cancelled с attempts=[]; accepted recorded/merge_attempted/failed/conflicted/invalid экспортируется с attempts[]+recovery evidence и без merge proof; merged только с полным merge proof."
  cutover_record:
    fields:
      cutover_sha: cutover_sha
      main_sha: "main_sha; CHECK main_sha=cutover_sha и оба snapshot SHAs равны им."
      sign_off_actor_stable_id: signoff_actor_stable_id
      timestamp: signoff_at
      validation_evidence: "validation_evidence JSON array сохраняет sanitized canonical evidence items; record hash связывает полное представление."
      write_frozen: write_freeze_observed
      protected_tag_ref: protected_tag_ref
      preflight_snapshot_id: preflight_snapshot_id
      published_snapshot_id: published_snapshot_id
      validation_times: "preflight_validated_at/published_validated_at обязательны по state; preflight≤published≤index_activation_observed_at для activating/activated."
      publication_fence: "publication_fences/active_pointers fencing_token, сериализованный как decimal string; обязателен для activating/activated."
      user_access_enabled: "state='active' AND space_activated_at IS NOT NULL; иначе false."
    states:
      freeze_pending: prepared
      frozen: frozen
      protected: protecting
      preflight: preflight
      activating: activating
      activated: active
      failed: failed
      conflicted: conflicted
    activation: "Preflight request совпадает по Space/repository/target/SHA и preflight=true. Separate published request связан preflight=false теми же perimeter/SHA; request/run/snapshot IDs отличаются от preflight. Оба SHA=cutover_sha=main_sha, closure и projection hashes совпадают, published full/purpose=published/is_preflight=false/ready→active. Activating допустим только с active published pointer, nonnull activation timestamp/fence и space_activated_at=NULL."
    ordering: "CI сначала активирует validated published pointer, GO затем активирует Space; index_activation_observed_at<=space_activated_at. Preflight никогда не active/serving."
  proposal_view:
    record: "ProposalRecord ↔ proposal_versions, включая durable proposal_version_id, rationale/evidence, optional origin и supersedes_proposal_version_id; actor_type только human/agent/connector."
    states: "draft/in_review/conflicted/rejected/cancelled/published/superseded ↔ одноимённые proposals.state; superseded никогда не переводится как archived."
    archived: "ProposalView.archived является производным canonical document archived=true + archive, не proposals.state=superseded, rejected или deleted."
    service_actor: "service допустим только internal AuthZ/audit contexts, не ProposalRecord.actor_type."
  index_snapshot_and_events:
    contract: index-snapshot-v1
    ids:
      main_generation_id: "generations.generation_key (durable ancestry-derived), не disposable generations.generation_id UUID."
      parent_generation_id: "previous generation.generation_key, не previous UUID."
      index_profile_version: "index_profiles.index_profile_version, не disposable profile_id UUID."
      run_id: "index_runs.run_id после materialization immutable run; IndexRequested.external_run_ref является только logical correlation."
      snapshot_id: "snapshots.snapshot_id; preflight и published IDs различны."
      request_generation: "index_requests.main_generation_key и IndexRequested.main_generation_id обязаны разрешиться в тот же generation_key через CI contract, без cross-schema FK."
    fields:
      ancestry_root_sha: generations.origin_snapshot_sha
      history_rewrite_detected: "generations/history flag, связанный composite FK с run/snapshot; true запрещает incremental."
      closure: "complete/closure_sha256/incremental_base_snapshot_sha/full_snapshot_equivalence/missing_inputs восстанавливаются из index_runs и сверяются со snapshots composite FK."
      validated_prerequisites: "Incremental equivalence требует full parent closure_validated=true + validation_evidence_ready descriptor+nonempty hashed independent evidence. Cutover published требует preflight parent closure_validated=true и preflight descriptor validation_evidence_ready=true с теми же SHA/closure/hashes; run_state/IDs различны."
      equivalence_evidence: "closure.equivalence_evidence ↔ index_runs.equivalence_evidence: full_run_id/full_snapshot_id, canonical ready/active states, validated_at, perimeter, main_snapshot_sha, main_generation_id, index_profile_version, complete/missing_inputs, closure+projection hashes, evidence_sha256. Internal ready_to_publish↔ready и validated↔ready; evidence hash=JCS без evidence_sha256."
      policy: "policy_bundle_id/access_policy_revision/approval_policy_revision хранятся в run и snapshot; document projection ссылается на ту же тройку."
      projections: "exact_projection/semantic_projection statuses и hashes ↔ snapshots exact_/semantic_ fields; ready требует nonnull 64-hex hashes."
      documents: "documents[] сериализует только eligible=true rows: document_id/path/document_revision_sha/content_sha256/blob_sha/dependency_sha256 и dependency_closure из document_dependencies+hash links; archived/excluded internal rows не публикуются."
      preflight: "purpose=cutover_preflight/is_preflight=true/serving_allowed=false/cutover_sha=snapshot_sha; state=active запрещён."
    states:
      ready: "index_runs.ready_to_publish→IndexRunStatus.ready и snapshots.validated→IndexSnapshot.ready; validating не считается ready."
      passthrough: "requested/resolving/building/validating/active/superseded/failed/dead_letter сохраняются в run без rename; descriptor отсутствует/строится либо snapshots.validated маппируется в canonical ready."
      serving: "serving_allowed=true только snapshots.active + run_state=active + run_closure_validated=true + purpose=published + is_preflight=false + validation_evidence_ready=true + ready projections + full not_applicable или independently proven incremental equivalent."
    publication: "publication_fences(space_id,profile_id) сериализует все generations данного pointer; CAS проверяет expected fence/current pointer/latest Git ancestry/validated run, stale owner получает zero rows. Ordinary active run требует GO space_activation_state=active+timestamp/evidence; cutover_ref — единственное pre-activation exception."
  docops_review_metadata:
    contract: docops-review-metadata-v1
    fields: "document_review_states ↔ document_id/space_id/repository_id/document_revision_sha/valid_until/review_required/review_state/provenance/metadata_sha256; registry_revision/path/target/review proposal — additional projection bindings."
    queue: "scheduled=not expired; due=expired по server UTC+queued_at; in_review требует queue; resolved требует timestamp; removed=review_required=false+valid_until=null. review_required эквивалентно наличию даты."
    import: "Projection не второй канон: valid_until/provenance точно совпадают с document-front-matter-v2 в exact Git revision; review proposal FK запрещает чужой Space/repository/target/SHA."
    fixtures: "T01 обязан включить scheduled future, due expired, in_review, no-date/removed-date, wrong revision/Space и roundtrip canonical front matter→DB→review queue/event."
  source_sync_events:
    external_states: "observed/seen_durable/no_op/proposal_pending/merged/rejected/conflicted/tombstone/retry/dead_letter ↔ одноимённые source_sync_states.sync_state и SourceSyncChanged v1 states; никакого coerce в rejected/conflicted."
    proposal_mapping: "Event/API proposal_id и outstanding_proposal_id сохраняют stable proposal ID; DB outstanding_proposal_sha является дополнительным exact-version guard. все non-pending states очищают outstanding ID+SHA; merged сохраняет outcome_proposal_id+SHA отдельно."
    cursor_pairs: "seen_version+seen_hash, proposed_version+proposed_hash и merged_version+merged_hash null/not-null вместе и hashes=64-hex SHA256; merged также требует merge_commit_sha+outcome proposal. Proposal_pending требует proposed pair и пустой outcome."
    live_operational: "Не представлен в cursor table/events: typed read-only observation содержит snapshot_time и не создаёт document/proposal/merged cursor, MR, wiki или index lifecycle."
    outstanding: "outstanding_proposal_id+outstanding_proposal_sha+space_id+repository_id ссылаются на ту же immutable ProposalVersion; document_id остаётся logical same-Space binding через GO contract, не cross-schema FK."
  revocation_events:
    fields: "AccessRevoked.stable_id/revocation_epoch/reason ↔ revocation_events stable_id/revocation_epoch/canonical_reason; authz_context_spaces хранит epoch каждого Space."
    dedupe_order: "event_dedupe_hash связывает stable identity+epoch+reason+scopes; issuance применяет монотонный epoch per identity и идемпотентный event ID."
    internal_only: "sync_failed без canonical_reason не порождает AccessRevoked и не присваивает выдуманный canonical reason."
  paths:
    documents: "PATH repository-relative NFC; никакого leading slash."
    policies_and_scopes: "POLICY_PATH/PATH_SCOPE repository-relative NFC: canonical '/' ↔ пустой scope prefix, '/pricing' ↔ 'pricing', '/approval-policy.yaml' ↔ 'approval-policy.yaml'; reverse добавляет ровно один '/', NFC/traversal проверяются до mapping."
    normalization: "Silent lowercase/NFD normalization запрещены; document paths не пустые/absolute, policy paths nonempty relative, пустой prefix разрешён только для scope root."
  t01_verification_notes:
    - "Roundtrip Decision accepted/rejected/cancelled, recorded/merge_attempted/merged/failed/conflicted/invalid/quarantined, recovery flags и same-ID retry до/после нового attempt."
    - "Crash valid note/tag с отсутствующими DB row/barrier восстанавливает recorded+unresolved recovery+attempts=[] и отсутствующим no_merge_proven; reject/cancel не создают merge operation; failed/conflicted без каждого note/tag/hash → invalid+missing_integrity."
    - "Два Spaces с разными repositories/policies/groups/snapshots/epochs: wrong bundle, revisions, membership и path scope отклоняются; fan-out не использует parent global policy."
    - "AuthZ negative matrix: pending/invalid/superseded policy, building/failed/superseded group snapshot, mismatched issuer/captured_at/membership hash/epoch, wrong member/subject stable ID и external_only с nonnull identity отклоняются."
    - "Corrupted rows для wrong Space/repository/target/base/proposal/SHA/action в policy/cutover/grant/source/document/pointer/merge/recovery associations отклоняются composite FK/CHECK."
    - "Unknown/invalid/quarantined без доказанного outcome не очищает barrier; failed retry только request_completed+verified_not_merged; conflicted/invalid retry запрещён."
    - "Preflight wrong SHA, active preflight, active requested, null ready hashes, rewrite+incremental, non-equivalent incremental, ordinary publication без active-Space evidence и reused preflight run/snapshot IDs отклоняются."
    - "Incremental/published prerequisites requested/failed/unvalidated, без ready descriptor, с пустым/missing-key/null-value equivalence evidence, wrong evidence hash/state/validated_at или mismatched parent SHA/closure/projection hashes отклоняются; activating без active pointer/fence/validated timestamps или с user access enabled отклоняется."
    - "Source negative matrix: missing/mismatched seen/proposed/merged version+hash, merged без merged_hash/commit/outcome proposal и любой non-pending state с outstanding ID или SHA отклоняется."
    - "Одновременная публикация old/new generations для одного Space/profile выполняется через один fence/CAS; stale owner обновляет zero rows."
    - "Cutover roundtrip проверяет разные preflight/published run+snapshot IDs, один SHA/closure/projection hashes и pointer→Space activation order."
    - "ProposalView archived/superseded distinctions, index ready mappings, полный source state enum, generation_key/profile version и actor/per-Space revocation epochs roundtrip имеют positive/negative fixtures."
    - "Resolved link с swapped target UUID/projection, live_operational cursor и cross-actor/cross-route idempotency-key reuse отклоняются."
contract_test_assertions:
  - id: DB-OWN-001
    assert: "Каждая product table наследует единственного schema owner/writer/migration owner; другие components не имеют writer role."
  - id: DB-BOUND-002
    assert: "Каждый foreign_keys[].references.schema равен содержащей схеме; cross-schema FK и table writes отсутствуют."
  - id: DB-CANON-003
    assert: "Каждая table имеет nonempty canonical_source, boolean rebuildable, rebuild_strategy, classification, retention и security."
  - id: DB-SPACE-004
    assert: "Space-scoped queries и fixtures применяют space_id; cross-Space documents/links/dependencies/chunks/embeddings/pointers отклоняются."
  - id: DB-DEC-005
    assert: "decision_id уникален; recorded accepted/rejected/cancelled имеют attempts=[] и no synthetic merge_operation; crash note/tag→DB восстанавливает recorded+recovery без no_merge_proven. Merge attempts real-only; failed/conflicted сохраняют полный note/tag/hash evidence, иначе invalid+reason."
  - id: DB-REC-006
    assert: "merge_attempted + barrier + unresolved target_barrier_decisions фиксируются до external call; unknown/invalid/quarantined без proven outcome не очищает barrier."
  - id: DB-FENCE-007
    assert: "Merge result и barrier clear проверяют owner+fencing и отсутствие unresolved links по всему target; stale owner update затрагивает ноль rows."
  - id: DB-IDEM-008
    assert: "idempotency_key globally unique; actor+route+payload сохранены для equality; другой actor/route/payload -> IDEMPOTENCY_KEY_REUSED до writes."
  - id: DB-AUTHZ-009
    assert: "Каждый authz-context-v2 Space использует valid policy+ready group snapshot; issuer/context_evaluated_at и snapshot ID/captured_at/membership hash/revocation epoch совпадают через composite FK; pending/invalid/building/failed/superseded inputs запрещены."
  - id: DB-PRINC-022
    assert: "Membership/personal grants registry mode связывает identity+issuer+stable_id; external_only до JIT имеет NULL identity_id. Personal exception требует identity subject+reason, group policy — ready same-issuer group snapshot без GitLab users."
  - id: DB-IDX-010
    assert: "Incremental ready/active и cutover published ссылаются на distinct parent run с closure_validated=true и descriptor validation_evidence_ready=true; perimeter/SHA/closure/projection hashes совпадают, canonical evidence содержит все required keys без nulls и связывает parent IDs/states/validated_at/perimeter/closure+projection/evidence hashes; requested/failed/empty/mismatched parents отклоняются."
  - id: DB-PTR-011
    assert: "Fence/CAS per Space/profile сериализует все generations; full-perimeter FK допускает только active published non-preflight ready snapshot; stale update zero rows."
  - id: DB-SCOPE-014
    assert: "Spaces UNIQUE(space_id,repository_id) используется policy snapshots/cutovers/grants; current/previous/grant из другого Space/repository отклоняются."
  - id: DB-REC-015
    assert: "target_barriers.active_decision_id и last_reconciliation_run_id, findings и merge attempts связаны same Space/repository/target; active hint имеет unresolved link; любой unresolved link требует recovery=true, а NOT recovery запрещает active hint/unresolved links."
  - id: DB-CUT-016
    assert: "Cutover activating требует distinct request/run/snapshot IDs, active published non-preflight pointer+serving, same SHA/closure/hashes, preflight/published validated_at, fence+activation timestamp и space_activated_at=NULL; active добавляет Space activation+ordering; preflight никогда не active."
  - id: DB-SRC-017
    assert: "Seen/proposed/merged version+hash pairs согласованы и SHA256; proposal_pending требует proposed pair+outstanding, merged требует merged pair+commit+outcome proposal и очищает outstanding; все non-pending states очищают outstanding ID+SHA; live_operational запрещён."
  - id: DB-LINK-018
    assert: "Resolved target projection и stable target_document_id указывают на один document в том же snapshot/Space; swapped IDs отклоняются."
  - id: DB-ERR-019
    assert: "Index errors связывают run/snapshot/perimeter и run родительского snapshot; mixed run/snapshot/Space/repository/target отклоняются."
  - id: DB-MAP-020
    assert: "T01 выполняет canonical↔projection roundtrip всех mappings, включая reject/cancel/recovery/quarantine/Cutover/ProposalView/source/index/generation/profile/path/epoch."
  - id: DB-DOCOPS-021
    assert: "docops-review-metadata-v1 точно проецирует canonical front-matter-v2 valid_until/provenance, хранит review_required/metadata hash и same-perimeter proposal; scheduled/due/in_review/removed fixtures проходят queue roundtrip."
  - id: DB-SEC-012
    assert: "Fixtures не содержат raw secrets; audit/details не содержат raw private content; retrieval vectors/chunks остаются private per-Space data."
  - id: DB-T00-013
    assert: "Catalog не содержит vector(N), выбранного ANN method/parameters, numeric retention/RPO/RTO или unverified upstream physical schema."
open_items:
  t00:
    - "Pinned Open WebUI/GitLab/PostgreSQL baselines, upstream physical schemas/roles/migrations и single-instance compatibility."
    - "GitLab note/tag/trailer/parent/export/merge-only-GO/webhook capabilities на target version/edition."
    - "Existing retrieval backend; pgvector+FTS, Russian tsvector config, HNSW/IVFFlat, iterative/exact fallback, partitioning и ACL-aware recall benchmark."
    - "Embedding model/dimensions, chunking, reranker/OCR/extraction config, hoster model IDs, offline assets и external backend mapping."
    - "Target Git SHA algorithm, document_revision_sha mapping, object-store layout и CI pointer/advisory-lock/fencing conventions."
  t01:
    - "DecisionRecord/ProposalRecord canonical serialization и record_sha256; index-snapshot-v1 dependency schema и generation_key algorithm."
    - "Synthetic ownership, cross-Space, crash/fencing, rebuild/restore, secret/audit и full/incremental equivalence contract tests."
    - "Candidate tsvector/vector representation может быть заменено audited existing backend representation с обновлением catalog."
  owner_decisions:
    - "RPO/RTO, freshness/latency/quality/budgets и backup snapshot consistency procedure."
    - "Branches/MR/audit/chats/files/object versions/mirrors/backups retention."
    - "Group snapshots/contexts/grant sync/webhook/index request/reconciliation/error DLQ history retention."
    - "Idempotency replay retention; old index runs/generations/profiles/chunks/embeddings/source operation history retention."
    - "Strict/pii_permitted legal/access/retention policy; hard purge/filtered export/break-glass/stale reads требуют отдельных ADR."
  fixed_time_requirements:
    group_refresh: "≤15 минут; не retention"
    revocation_slo: "≤30 минут; sensitive operations при ближайшей recheck; не retention"
