        checks:
          - macro: git_sha
            columns: [cutover_sha, main_sha, preflight_snapshot_sha, published_snapshot_sha, published_access_policy_revision, published_approval_policy_revision]
          - macro: sha256
            columns: [cutover_record_sha256, preflight_dependency_closure_hash, preflight_exact_projection_hash, preflight_semantic_projection_hash, published_dependency_closure_hash, published_exact_projection_hash, published_semantic_projection_hash]
          - expression: "state IN ('prepared','frozen','protecting','preflight','activating','active','failed','conflicted')"
          - expression: "preflight_request_marker"
          - expression: "main_sha = cutover_sha"
          - expression: "(published_index_request_id IS NULL AND published_request_marker IS NULL) OR (published_index_request_id IS NOT NULL AND published_request_marker IS FALSE)"
          - expression: "published_index_request_id IS NULL OR preflight_index_request_id IS NULL OR published_index_request_id <> preflight_index_request_id"
          - expression: "preflight_purpose IS NULL OR preflight_purpose = 'cutover_preflight'"
          - expression: "preflight_is_preflight IS NULL OR preflight_is_preflight"
          - expression: "preflight_serving_allowed IS NULL OR NOT preflight_serving_allowed"
          - expression: "preflight_snapshot_sha IS NULL OR preflight_snapshot_sha = cutover_sha"
          - expression: "published_snapshot_sha IS NULL OR published_snapshot_sha = cutover_sha"
          - expression: "published_is_preflight IS NULL OR published_is_preflight = false"
          - expression: "state NOT IN ('preflight','activating','active') OR (preflight_index_request_id IS NOT NULL AND preflight_run_id IS NOT NULL AND preflight_snapshot_id IS NOT NULL)"
          - expression: "state NOT IN ('preflight','activating','active') OR preflight_validated_at IS NOT NULL"
          - expression: "state NOT IN ('activating','active') OR (preflight_purpose IS NOT NULL AND preflight_snapshot_state IS NOT NULL AND preflight_snapshot_sha IS NOT NULL AND published_run_type IS NOT NULL AND published_purpose IS NOT NULL AND published_snapshot_state IS NOT NULL AND published_snapshot_sha IS NOT NULL AND published_full_snapshot_equivalence IS NOT NULL)"
          - expression: "state NOT IN ('activating','active') OR (published_validated_at IS NOT NULL AND preflight_validated_at IS NOT NULL AND preflight_validated_at <= published_validated_at AND published_validated_at <= index_activation_observed_at)"
          - expression: "state <> 'activating' OR (preflight_index_request_id IS NOT NULL AND published_index_request_id IS NOT NULL AND published_request_marker IS FALSE AND preflight_index_request_id <> published_index_request_id AND preflight_run_id IS NOT NULL AND published_run_id IS NOT NULL AND preflight_run_id <> published_run_id AND preflight_snapshot_id IS NOT NULL AND published_snapshot_id IS NOT NULL AND preflight_snapshot_id <> published_snapshot_id AND preflight_purpose = 'cutover_preflight' AND preflight_is_preflight IS TRUE AND preflight_serving_allowed IS FALSE AND preflight_snapshot_state = 'ready' AND preflight_snapshot_sha = cutover_sha AND published_snapshot_sha = cutover_sha AND published_run_type = 'full' AND published_purpose = 'published' AND published_is_preflight IS FALSE AND published_serving_allowed IS TRUE AND published_snapshot_state = 'active' AND preflight_dependency_closure_hash IS NOT NULL AND published_dependency_closure_hash = preflight_dependency_closure_hash AND published_full_snapshot_equivalence = 'not_applicable' AND published_history_rewrite_detected IS FALSE AND preflight_exact_projection_hash IS NOT NULL AND preflight_semantic_projection_hash IS NOT NULL AND published_exact_projection_hash = preflight_exact_projection_hash AND published_semantic_projection_hash = preflight_semantic_projection_hash AND published_policy_bundle_id IS NOT NULL AND published_access_policy_revision IS NOT NULL AND published_approval_policy_revision IS NOT NULL AND publication_fence IS NOT NULL AND index_activation_observed_at IS NOT NULL AND space_activated_at IS NULL)"
          - expression: "state <> 'active' OR (published_index_request_id IS NOT NULL AND published_request_marker IS FALSE AND preflight_index_request_id <> published_index_request_id AND publication_fence IS NOT NULL)"
          - expression: "state <> 'active' OR (write_freeze_observed AND protected_at IS NOT NULL AND protected_tag_ref IS NOT NULL AND preflight_index_request_id IS NOT NULL AND preflight_run_id IS NOT NULL AND preflight_snapshot_id IS NOT NULL AND published_run_id IS NOT NULL AND published_snapshot_id IS NOT NULL AND preflight_run_id <> published_run_id AND preflight_snapshot_id <> published_snapshot_id AND preflight_purpose = 'cutover_preflight' AND preflight_is_preflight IS TRUE AND preflight_serving_allowed IS FALSE AND preflight_snapshot_state = 'ready' AND preflight_snapshot_sha = cutover_sha AND published_snapshot_sha = cutover_sha AND published_run_type = 'full' AND published_purpose = 'published' AND published_is_preflight IS FALSE AND published_serving_allowed IS TRUE AND published_snapshot_state = 'active' AND preflight_dependency_closure_hash IS NOT NULL AND published_dependency_closure_hash = preflight_dependency_closure_hash AND published_full_snapshot_equivalence = 'not_applicable' AND published_history_rewrite_detected IS FALSE AND preflight_exact_projection_hash IS NOT NULL AND preflight_semantic_projection_hash IS NOT NULL AND published_exact_projection_hash = preflight_exact_projection_hash AND published_semantic_projection_hash = preflight_semantic_projection_hash AND published_policy_bundle_id IS NOT NULL AND published_access_policy_revision IS NOT NULL AND published_approval_policy_revision IS NOT NULL AND index_activation_observed_at IS NOT NULL AND space_activated_at IS NOT NULL AND index_activation_observed_at <= space_activated_at)"
        indexes:
          - columns: [state]
      operation_events:
        purpose: "Sanitized append-only operational audit для correlation, не canonical DecisionRecord."
        canonical_source: "Canonical decisions в GitLab note/tag/merge + GitLab audit; журнал не единственный audit."
        rebuildable: false
        rebuild_strategy: "Journal history не гарантирован; отсутствие журнала не используется как merge evidence."
        classification: audit_restricted
        retention: {policy: audit_owner_decision, rule: "Runtime INSERT/SELECT only; controlled maintenance отдельно; canonical decisions хранятся в Git."}
        security: "Запрещены raw secrets, tokens, passwords, document/chunk/query text, rationale/evidence text, source/provider payloads и необязательный private content."
