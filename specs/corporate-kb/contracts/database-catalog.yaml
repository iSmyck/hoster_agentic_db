          updated_at: {type: timestamptz, nullable: false}
        primary_key: [source_binding_id, source_object_id]
        foreign_keys:
          - columns: [outstanding_proposal_id, outstanding_proposal_sha, space_id, repository_id]
            references: {schema: kb_ops, table: proposal_versions, columns: [proposal_id, proposal_sha, space_id, repository_id]}
            on_delete: restrict
          - columns: [outcome_proposal_id, outcome_proposal_sha, space_id, repository_id]
            references: {schema: kb_ops, table: proposal_versions, columns: [proposal_id, proposal_sha, space_id, repository_id]}
            on_delete: restrict
        uniques: []
        checks:
          - macro: git_sha
            columns: [previous_imported_base_sha, outstanding_proposal_sha, outcome_proposal_sha, merged_commit_sha]
          - macro: sha256
            columns: [source_config_hash, seen_hash, proposed_hash, merged_hash]
          - macro: nonempty
            columns: [owner_stable_id, source_account_ref]
          - expression: "ownership_mode IN ('migrated','source_managed','curated')"
          - expression: "data_profile IN ('strict','pii_permitted')"
