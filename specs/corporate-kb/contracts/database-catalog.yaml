          equivalence_verified_at: {type: timestamptz, nullable: true}
          equivalence_evidence_sha256: {type: text, nullable: true}
          idempotency_key: {type: text, nullable: false}
          requested_by_ref: {type: text, nullable: true, reference_kind: logical_go_index_request_api_only}
          cutover_ref: {type: uuid, nullable: true, reference_kind: logical_go_cutover_api_only}
          space_activation_state: {type: text, nullable: false}
          space_activation_observed_at: {type: timestamptz, nullable: true}
