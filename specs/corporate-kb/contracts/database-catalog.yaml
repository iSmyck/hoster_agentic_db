        checks:
          - macro: nonempty
            columns: [finding_type, subject_key]
          - expression: "outcome IN ('unknown','merged','failed','conflicted','invalid','quarantined','resolved')"
          - expression: "merge_outcome IN ('unknown','verified_merged','verified_not_merged','not_applicable')"
          - expression: "decision_id IS NULL OR (space_id IS NOT NULL AND repository_id IS NOT NULL AND target_branch IS NOT NULL)"
          - expression: "outcome NOT IN ('unknown','quarantined') OR quarantine_required"
          - expression: "outcome <> 'unknown' OR merge_outcome = 'unknown'"
          - expression: "outcome <> 'merged' OR (merge_outcome = 'verified_merged' AND request_completed)"
          - expression: "outcome NOT IN ('failed','conflicted') OR (merge_outcome = 'verified_not_merged' AND request_completed)"
          - expression: "NOT (outcome = 'invalid' AND merge_outcome = 'unknown') OR quarantine_required"
          - expression: "outcome <> 'resolved' OR (resolved_at IS NOT NULL AND merge_outcome <> 'unknown' AND (merge_outcome = 'not_applicable' OR request_completed))"
        indexes:
          - columns: [decision_id]
          - columns: [quarantine_required, outcome]
          - columns: [repository_id, target_branch]
