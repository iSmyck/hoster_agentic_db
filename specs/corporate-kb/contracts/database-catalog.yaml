        uniques: []
        checks:
          - macro: sha256
            columns: [payload_hash]
          - macro: nonempty
            columns: [actor_stable_id, route, idempotency_key, request_id]
          - expression: "expires_at IS NULL OR expires_at > created_at"
        indexes:
          - columns: [actor_stable_id, route]
          - columns: [expires_at]
          - columns: [decision_id]
          - columns: [request_id]
      webhook_inbox:
        purpose: "Authenticated at-least-once webhook intake, dedupe, retry и DLQ."
        canonical_source: "GitLab/AuthZ/object/source state; webhook только подсказка, не доказательство результата."
        rebuildable: false
        rebuild_strategy: "Точный inbox history не гарантирован; periodic HEAD/source reconciliation создаёт работу заново."
        classification: operational
        retention: {policy: webhook_owner_decision, rule: "Active retry/DLQ не удалять до resolution; history по owner policy."}
        security: "No signature secrets, raw private payload или evidence; metadata строго allowlisted."
        columns:
          source: {type: text, nullable: false}
          event_id: {type: text, nullable: false}
          space_id: {type: text, nullable: true}
          repository_id: {type: text, nullable: true}
          event_type: {type: text, nullable: false}
          event_sha256: {type: text, nullable: false}
          authenticity_state: {type: text, nullable: false}
          received_at: {type: timestamptz, nullable: false}
          observed_main_sha: {type: text, nullable: true}
          metadata: {type: jsonb, nullable: false}
          processing_state: {type: text, nullable: false}
          attempt_count: {type: integer, nullable: false}
          next_attempt_at: {type: timestamptz, nullable: true}
          last_error_code: {type: text, nullable: true}
          dead_lettered_at: {type: timestamptz, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [source, event_id]
        foreign_keys: []
        uniques:
          - columns: [source, event_sha256]
        checks:
          - macro: sha256
            columns: [event_sha256]
          - macro: git_sha
            columns: [observed_main_sha]
          - expression: "authenticity_state IN ('verified','rejected')"
          - expression: "processing_state IN ('received','processing','dispatched','retry','dead_letter','ignored')"
          - expression: "attempt_count >= 0"
          - expression: "authenticity_state <> 'rejected' OR processing_state = 'ignored'"
        indexes:
          - columns: [processing_state, next_attempt_at]
          - columns: [repository_id, received_at]
      index_requests:
        purpose: "GO outbox/dispatch projection exact-SHA IndexRequested для CI."
        canonical_source: "GitLab exact HEAD/CutoverRecord; CI/index worker владеет index run."
