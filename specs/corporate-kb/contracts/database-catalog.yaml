          owner_stable_id: {type: text, nullable: false}
          source_type: {type: text, nullable: false}
          source_account_ref: {type: text, nullable: false}
          source_config_hash: {type: text, nullable: false}
          previous_imported_base_sha: {type: text, nullable: true}
          seen_version: {type: text, nullable: true}
