      authz_context_spaces:
        purpose: "Независимый authz-context-v2 policy/group/revocation binding для каждого space_scopes[] entry."
        canonical_source: "Per-Space AuthZ evaluation из одного repository=Space policy bundle и одного membership snapshot."
        rebuildable: false
        rebuild_strategy: "Не восстанавливается как действующий binding; fresh context пересчитывает каждый Space независимо."
        classification: security_personal
        retention: {policy: inherit_authz_context, rule: "Хранится не дольше parent context audit TTL; revocation не ждёт cleanup."}
        security: "Запрещено применять bundle/groups/revisions/snapshot одного Space к другому; path_scopes содержат только этот Space."
