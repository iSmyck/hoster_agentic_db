  kb_index:
    owner:
      component: ci_index_workers
      writer_role: kb_index_writer
      migration_owner: ci_index_workers
      active_pointer_writer: dedicated_single_pointer_publisher_same_owner_role
    readers:
      - role: kb_index_reader
        components: [retrieval_adapter]
        access: read_only_scoped_candidates_and_status
      - role: kb_index_status_reader
        components: [ci_index_workers]
        access: read_only_internal_status
    direct_database_consumers_forbidden: [identity_authz_adapter, git_orchestrator, open_webui_browser, agent, connector]
    tables:
      generations:
        purpose: "Git ancestry generation, независимая от index profile; SHA sorting запрещена."
        canonical_source: "Git ancestry и exact target HEAD."
        rebuildable: true
        rebuild_strategy: "Ancestry scan; UUID может измениться, generation_key восстанавливается по versioned T01 algorithm; history rewrite -> new generation + full run."
        classification: operational
        retention: {policy: index_generation_owner_decision, rule: "Old generations по owner index/audit retention; rebuild не выполняет Git history rewrite."}
        security: "No content/secrets; только ancestry evidence и exact revisions."
        columns:
          generation_id: {type: uuid, nullable: false}
          generation_key: {type: text, nullable: false}
          space_id: {type: text, nullable: false}
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          previous_generation_id: {type: uuid, nullable: true}
          origin_snapshot_sha: {type: text, nullable: false}
          latest_observed_sha: {type: text, nullable: false}
          change_reason: {type: text, nullable: false}
          history_rewrite_detected: {type: boolean, nullable: false}
          ancestry_evidence: {type: jsonb, nullable: false}
          created_at: {type: timestamptz, nullable: false}
          last_observed_at: {type: timestamptz, nullable: false}
        primary_key: [generation_id]
        foreign_keys:
          - columns: [previous_generation_id, space_id, repository_id, target_branch]
            references: {schema: kb_index, table: generations, columns: [generation_id, space_id, repository_id, target_branch]}
            on_delete: restrict
        uniques:
          - columns: [repository_id, target_branch, generation_key]
          - columns: [space_id, repository_id, target_branch, generation_key]
          - columns: [generation_id, space_id, repository_id, target_branch]
          - columns: [generation_id, space_id, repository_id, target_branch, history_rewrite_detected]
        checks:
          - macro: git_sha
            columns: [origin_snapshot_sha, latest_observed_sha]
          - macro: nonempty
            columns: [generation_key]
          - expression: "change_reason IN ('initial','history_rewrite','restore_rebuild')"
          - expression: "history_rewrite_detected = (change_reason = 'history_rewrite')"
          - expression: "previous_generation_id IS NULL OR previous_generation_id <> generation_id"
        indexes:
          - columns: [space_id, target_branch, last_observed_at]
          - columns: [previous_generation_id]
      index_profiles:
        purpose: "Независимая versioned chunking/embedding/extraction/index semantics."
        canonical_source: "Versioned approved deployment/index configuration и provider inventory."
        rebuildable: true
        rebuild_strategy: "Загрузить config по version/hash; model/dimensions не выводятся из старой vector row как истина."
        classification: operational
        retention: {policy: index_profile_owner_decision, rule: "Старый live profile не удаляется во время shadow build; далее owner retention."}
        security: "No provider credentials/offline asset secrets; unplanned fallback запрещён."
        columns:
          profile_id: {type: uuid, nullable: false}
          index_profile_version: {type: text, nullable: false}
          engine: {type: text, nullable: false}
          chunking_config: {type: jsonb, nullable: false}
          embedding_model_id: {type: text, nullable: true}
          embedding_dimensions: {type: integer, nullable: true, status: unknown_t00}
          extraction_config: {type: jsonb, nullable: false}
          config_hash: {type: text, nullable: false}
          status: {type: text, nullable: false}
          created_at: {type: timestamptz, nullable: false}
          validated_at: {type: timestamptz, nullable: true}
        primary_key: [profile_id]
        foreign_keys: []
        uniques:
          - columns: [index_profile_version]
          - columns: [profile_id, index_profile_version]
          - columns: [config_hash]
        checks:
          - macro: sha256
            columns: [config_hash]
          - macro: nonempty
            columns: [index_profile_version, engine]
          - expression: "embedding_dimensions IS NULL OR embedding_dimensions > 0"
          - expression: "status IN ('candidate','validated','retired')"
          - expression: "status <> 'validated' OR validated_at IS NOT NULL"
        indexes:
          - columns: [status]
      index_runs:
        purpose: "Immutable exact-SHA input, independent full-closure equivalence evidence и full/incremental/preflight/published lifecycle."
        canonical_source: "Exact eligible Git snapshot + immutable assets + approved config + independently computed closure evidence."
        rebuildable: true
        rebuild_strategy: "Runs пересоздаются; incremental equivalence доказывается заново независимым full run на том же SHA; history rewrite только full."
