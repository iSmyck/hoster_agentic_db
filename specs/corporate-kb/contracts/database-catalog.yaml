        rebuild_strategy: "Request history disposable; HEAD reconciliation создаёт новый exact request."
        classification: operational
        retention: {policy: index_queue_owner_decision, rule: "Queue/DLQ history по owner policy; active DLQ до resolution."}
        security: "GO не пишет kb_index или active pointer; preflight не является serving request."
