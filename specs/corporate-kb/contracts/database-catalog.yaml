          merged_version: {type: text, nullable: true}
          merged_hash: {type: text, nullable: true}
          merged_commit_sha: {type: text, nullable: true}
          sync_state: {type: text, nullable: false}
          last_error_code: {type: text, nullable: true}
          last_observed_at: {type: timestamptz, nullable: true}
