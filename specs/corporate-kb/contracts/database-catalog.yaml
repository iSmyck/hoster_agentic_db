          dedupe_key: {type: text, nullable: false}
          space_id: {type: text, nullable: false}
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          main_sha: {type: text, nullable: false}
          main_generation_key: {type: text, nullable: false}
          requested_profile_version: {type: text, nullable: true}
          reason: {type: text, nullable: false}
          preflight: {type: boolean, nullable: false}
          state: {type: text, nullable: false}
          attempt_count: {type: integer, nullable: false}
          external_run_ref: {type: text, nullable: true, reference_kind: logical_ci_api_only}
          requested_at: {type: timestamptz, nullable: false}
          dispatched_at: {type: timestamptz, nullable: true}
          last_observed_at: {type: timestamptz, nullable: true}
          next_attempt_at: {type: timestamptz, nullable: true}
          last_error_code: {type: text, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [index_request_id]
        foreign_keys: []
        uniques:
          - columns: [dedupe_key]
          - columns: [index_request_id, space_id, repository_id, target_branch, main_sha, preflight]
        checks:
          - macro: git_sha
            columns: [main_sha]
          - macro: nonempty
            columns: [dedupe_key, main_generation_key, reason]
          - expression: "state IN ('pending','dispatched','retry','dead_letter','superseded','observed')"
          - expression: "attempt_count >= 0"
        indexes:
          - columns: [repository_id, target_branch, main_sha]
          - columns: [state, next_attempt_at]
          - columns: [preflight, state]
      source_sync_states:
