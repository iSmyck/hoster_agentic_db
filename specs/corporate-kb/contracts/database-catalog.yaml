          - columns: [policy_snapshot_id, space_id, repository_id, policy_bundle_id, access_policy_revision, approval_policy_revision, policy_validation_state]
            references: {schema: kb_authz, table: policy_snapshots, columns: [policy_snapshot_id, space_id, repository_id, policy_bundle_id, access_policy_revision, approval_policy_revision, validation_state]}
            on_delete: restrict
          - columns: [group_snapshot_id, issuer, group_snapshot_at, membership_sha256, group_snapshot_status, revocation_epoch]
            references: {schema: kb_authz, table: group_snapshots, columns: [group_snapshot_id, issuer, snapshot_at, membership_hash, status, revocation_epoch]}
            on_delete: restrict
        uniques:
          - columns: [context_id, space_id, repository_id, revocation_epoch]
        checks:
          - macro: git_sha
