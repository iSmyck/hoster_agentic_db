          - expression: "(proposed_version IS NULL) = (proposed_hash IS NULL)"
          - expression: "(merged_version IS NULL) = (merged_hash IS NULL)"
          - expression: "(outstanding_proposal_id IS NULL) = (outstanding_proposal_sha IS NULL)"
          - expression: "(outcome_proposal_id IS NULL) = (outcome_proposal_sha IS NULL)"
          - expression: "sync_state <> 'proposal_pending' OR (outstanding_proposal_id IS NOT NULL AND outstanding_proposal_sha IS NOT NULL AND proposed_version IS NOT NULL AND proposed_hash IS NOT NULL AND outcome_proposal_id IS NULL AND outcome_proposal_sha IS NULL)"
          - expression: "sync_state = 'proposal_pending' OR (outstanding_proposal_id IS NULL AND outstanding_proposal_sha IS NULL)"
          - expression: "sync_state <> 'merged' OR (merged_version IS NOT NULL AND merged_hash IS NOT NULL AND merged_commit_sha IS NOT NULL AND outcome_proposal_id IS NOT NULL AND outcome_proposal_sha IS NOT NULL)"
        indexes:
          - columns: [outstanding_proposal_id]
            predicate: "outstanding_proposal_id IS NOT NULL"
          - columns: [outcome_proposal_id]
            predicate: "outcome_proposal_id IS NOT NULL"
          - columns: [space_id, sync_state]
          - columns: [document_id]
          - columns: [seen_hash]
      document_review_states:
        purpose: "Versioned docops-review-metadata-v1 projection canonical valid_until/provenance, exact Git revision и approver review queue."
        canonical_source: "document-front-matter-v2 valid_until/provenance в exact Git document revision; DocOps registry хранит только versioned projection/queue, не второй канон."
        rebuildable: true
        rebuild_strategy: "Rebuild из exact canonical revision; expiry/queue вычисляются заново без изменения canonical document bytes."
        classification: operational_private
        retention: {policy: docops_review_owner_decision, rule: "Review history по owner DocOps policy; active due/in_review rows нельзя удалять до resolution."}
        security: "Document path/provenance доступны только после Space AuthZ; no private document text или registry secrets."
        columns:
          review_metadata_id: {type: uuid, nullable: false}
          schema_version: {type: text, nullable: false}
          space_id: {type: text, nullable: false}
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          document_id: {type: uuid, nullable: false, reference_kind: logical_same_space_git_document_only}
          document_path: {type: text, nullable: false}
          document_revision_sha: {type: text, nullable: false}
          registry_revision: {type: text, nullable: false}
          valid_until: {type: date, nullable: true}
          review_required: {type: boolean, nullable: false}
          review_state: {type: text, nullable: false}
          provenance: {type: jsonb, nullable: false}
          metadata_sha256: {type: text, nullable: false}
          review_proposal_id: {type: text, nullable: true}
          review_proposal_sha: {type: text, nullable: true}
          queued_at: {type: timestamptz, nullable: true}
          evaluated_at: {type: timestamptz, nullable: false}
          resolved_at: {type: timestamptz, nullable: true}
          observed_at: {type: timestamptz, nullable: false}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [review_metadata_id]
        foreign_keys:
          - columns: [review_proposal_id, review_proposal_sha, repository_id, space_id, target_branch]
            references: {schema: kb_ops, table: proposal_versions, columns: [proposal_id, proposal_sha, repository_id, space_id, target_branch]}
            on_delete: restrict
        uniques:
          - columns: [space_id, document_id, document_revision_sha, registry_revision]
          - columns: [space_id, document_id]
            predicate: "review_state IN ('due','in_review')"
        checks:
          - macro: git_sha
            columns: [document_revision_sha, review_proposal_sha]
          - macro: normalized_path
            columns: [document_path]
          - macro: sha256
            columns: [metadata_sha256]
          - macro: nonempty
            columns: [registry_revision]
          - expression: "schema_version = 'docops-review-metadata-v1'"
          - expression: "review_state IN ('scheduled','due','in_review','resolved','removed')"
          - expression: "(review_proposal_id IS NULL) = (review_proposal_sha IS NULL)"
          - expression: "review_required = (valid_until IS NOT NULL)"
          - expression: "review_state <> 'scheduled' OR (review_required AND valid_until >= evaluated_at::date)"
          - expression: "review_state <> 'due' OR (review_required AND valid_until < evaluated_at::date AND queued_at IS NOT NULL)"
          - expression: "review_state <> 'in_review' OR (review_required AND valid_until IS NOT NULL AND queued_at IS NOT NULL)"
          - expression: "review_state <> 'resolved' OR resolved_at IS NOT NULL"
          - expression: "review_state <> 'removed' OR (NOT review_required AND valid_until IS NULL)"
        indexes:
          - columns: [space_id, review_state, valid_until]
          - columns: [document_id, document_revision_sha]
          - columns: [review_proposal_id]
