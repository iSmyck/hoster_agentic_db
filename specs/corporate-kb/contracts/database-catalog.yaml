          - macro: sha256
            columns: [membership_sha256]
          - macro: nonempty
            columns: [issuer, repository_id, policy_bundle_id]
          - expression: "policy_validation_state = 'valid'"
          - expression: "group_snapshot_status = 'ready'"
          - expression: "group_snapshot_at <= context_evaluated_at"
          - expression: "revocation_epoch >= 0"
        indexes:
          - columns: [space_id, revocation_epoch]
          - columns: [policy_snapshot_id]
          - columns: [group_snapshot_id]
      revocation_events:
        purpose: "Revocation propagation, payload denial и live subscription closure projection."
        canonical_source: "IdP/Git policy/session changes + operational propagation observations."
        rebuildable: false
        rebuild_strategy: "Event history не гарантирован; fresh IdP/policy diff заново создаёт deny barrier."
        classification: security_personal
        retention: {policy: revocation_owner_decision, rule: "Active events нельзя удалять до completion; revocation SLO <=30 минут обязателен."}
        security: "Revocation не ждёт reindex; live subscriptions закрываются; raw content отсутствует."
        columns:
          revocation_event_id: {type: uuid, nullable: false}
          identity_id: {type: uuid, nullable: false}
          stable_id: {type: text, nullable: false}
          revocation_epoch: {type: bigint, nullable: false}
          event_dedupe_hash: {type: text, nullable: false}
          space_id: {type: text, nullable: true}
          repository_id: {type: text, nullable: true}
          policy_snapshot_id: {type: uuid, nullable: true}
          group_snapshot_id: {type: uuid, nullable: true}
          event_type: {type: text, nullable: false}
          canonical_reason: {type: text, nullable: true}
          detected_at: {type: timestamptz, nullable: false}
          deadline_at: {type: timestamptz, nullable: false}
          state: {type: text, nullable: false}
          attempt_count: {type: integer, nullable: false}
          last_error_code: {type: text, nullable: true}
          completed_at: {type: timestamptz, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [revocation_event_id]
        foreign_keys:
          - columns: [identity_id, stable_id]
            references: {schema: kb_authz, table: identities, columns: [identity_id, stable_id]}
            on_delete: restrict
          - columns: [space_id]
            references: {schema: kb_authz, table: spaces, columns: [space_id]}
            on_delete: restrict
          - columns: [policy_snapshot_id, space_id, repository_id]
            references: {schema: kb_authz, table: policy_snapshots, columns: [policy_snapshot_id, space_id, repository_id]}
            on_delete: restrict
          - columns: [group_snapshot_id]
            references: {schema: kb_authz, table: group_snapshots, columns: [group_snapshot_id]}
            on_delete: restrict
        uniques:
          - columns: [event_dedupe_hash]
        checks:
          - macro: sha256
            columns: [event_dedupe_hash]
          - macro: nonempty
            columns: [stable_id]
          - expression: "event_type IN ('group_changed','policy_changed','session_revoked','manual_disable','sync_failed')"
          - expression: "canonical_reason IS NULL OR canonical_reason IN ('group_removed','policy_changed','session_revoked','mover','leaver')"
          - expression: "state IN ('pending','propagating','completed','retry','dead_letter')"
          - expression: "revocation_epoch >= 0"
          - expression: "policy_snapshot_id IS NULL OR (space_id IS NOT NULL AND repository_id IS NOT NULL)"
          - expression: "deadline_at >= detected_at"
          - expression: "attempt_count >= 0"
          - expression: "state <> 'completed' OR completed_at IS NOT NULL"
        indexes:
          - columns: [state, deadline_at]
          - columns: [identity_id, revocation_epoch, state]
          - columns: [identity_id, state]
          - columns: [space_id, state]
  kb_ops:
    owner:
      component: git_orchestrator
      writer_role: kb_ops_writer
      migration_owner: git_orchestrator
    readers:
      - role: kb_ops_reader
        components: [git_orchestrator]
        access: read_only_go_status_query_paths
    direct_database_consumers_forbidden: [identity_authz_adapter, retrieval_adapter, open_webui_browser, agent, connector, ci_index_worker]
    tables:
      proposals:
        purpose: "Текущая GitLab MR/Proposal projection для queue/status."
        canonical_source: "GitLab merge request + append-only ProposalRecords."
        rebuildable: true
        rebuild_strategy: "Полный scan MR/notes/tags; optional title projection можно не восстанавливать."
        classification: operational_private
        retention: {policy: mr_lifecycle_owner_decision, rule: "Projection следует MR/audit retention; канон остаётся в GitLab."}
        security: "Title не попадает в audit/logs; evidence раскрывается только после AuthZ."
        columns:
          proposal_id: {type: text, nullable: false}
          space_id: {type: text, nullable: false}
          repository_id: {type: text, nullable: false}
          gitlab_mr_iid: {type: bigint, nullable: false}
          source_branch: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          state: {type: text, nullable: false}
          current_base_sha: {type: text, nullable: false}
          current_proposal_sha: {type: text, nullable: false}
          author_stable_id: {type: text, nullable: false}
          requester_stable_id: {type: text, nullable: false}
          title: {type: text, nullable: true}
          opened_at: {type: timestamptz, nullable: false}
          closed_at: {type: timestamptz, nullable: true}
          observed_at: {type: timestamptz, nullable: false}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [proposal_id]
        foreign_keys: []
        uniques:
          - columns: [repository_id, gitlab_mr_iid]
          - columns: [proposal_id, repository_id, space_id, target_branch]
          - columns: [proposal_id, space_id, repository_id]
        checks:
          - macro: git_sha
            columns: [current_base_sha, current_proposal_sha]
          - macro: nonempty
            columns: [proposal_id, repository_id, author_stable_id, requester_stable_id]
          - expression: "gitlab_mr_iid > 0"
          - expression: "state IN ('draft','in_review','published','conflicted','rejected','cancelled','superseded')"
        indexes:
          - columns: [space_id, state]
          - columns: [repository_id, target_branch, state]
      proposal_versions:
        purpose: "Immutable ProposalVersion и append-only ProposalRecord projection с author/version_author/requester/run."
        canonical_source: "Immutable MR source commit + append-only ProposalRecord в GitLab metadata."
        rebuildable: true
        rebuild_strategy: "Scan каждого exact source SHA и ProposalRecord; новая версия не перезаписывает старую."
        classification: operational_private
        retention: {policy: proposal_record_owner_audit_retention, rule: "Старые versions сохраняются по MR/audit policy; approval не переносится."}
        security: "Rationale/evidence не дублируются в audit; principals/run принимаются только из trusted context."
        columns:
          proposal_id: {type: text, nullable: false}
          proposal_version_id: {type: uuid, nullable: false}
          proposal_sha: {type: text, nullable: false}
          supersedes_proposal_version_id: {type: uuid, nullable: true}
          space_id: {type: text, nullable: false}
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          base_sha: {type: text, nullable: false}
          author_stable_id: {type: text, nullable: false}
          version_author_stable_id: {type: text, nullable: false}
          requester_stable_id: {type: text, nullable: false}
          actor_type: {type: text, nullable: false}
          run_id: {type: text, nullable: true}
          rationale: {type: text, nullable: false}
          evidence: {type: jsonb, nullable: false}
          origin: {type: jsonb, nullable: true}
          idempotency_key: {type: text, nullable: false}
          payload_hash: {type: text, nullable: false}
          proposal_record_sha256: {type: text, nullable: false}
          record_locator: {type: jsonb, nullable: false}
          created_at: {type: timestamptz, nullable: false}
        primary_key: [proposal_id, proposal_sha]
        foreign_keys:
          - columns: [proposal_id, repository_id, space_id, target_branch]
            references: {schema: kb_ops, table: proposals, columns: [proposal_id, repository_id, space_id, target_branch]}
            on_delete: restrict
          - columns: [supersedes_proposal_version_id, proposal_id, space_id, repository_id, target_branch]
            references: {schema: kb_ops, table: proposal_versions, columns: [proposal_version_id, proposal_id, space_id, repository_id, target_branch]}
            on_delete: restrict
        uniques:
          - columns: [proposal_version_id]
          - columns: [proposal_version_id, proposal_id, space_id, repository_id, target_branch]
          - columns: [proposal_id, proposal_sha, repository_id, space_id, target_branch]
          - columns: [proposal_id, proposal_sha, repository_id, space_id, target_branch, base_sha]
          - columns: [proposal_id, proposal_sha, space_id, repository_id]
        checks:
          - macro: git_sha
            columns: [proposal_sha, base_sha]
          - macro: sha256
            columns: [proposal_record_sha256, payload_hash]
          - macro: nonempty
            columns: [author_stable_id, version_author_stable_id, requester_stable_id, idempotency_key]
          - expression: "actor_type IN ('human','agent','connector')"
          - expression: "actor_type <> 'agent' OR run_id IS NOT NULL"
        indexes:
          - columns: [base_sha]
          - columns: [version_author_stable_id]
          - columns: [run_id]
          - columns: [created_at]
      decisions:
        purpose: "Rebuildable projection canonical DecisionRecord note+tag и Git-derived outcome."
        canonical_source: "Одинаковый canonical JSON в structured MR note + protected annotated tag на proposal_sha; merge commit/trailers."
        rebuildable: true
        rebuild_strategy: "Git-derived scan notes/tags/MR/main; missing/mismatch -> invalid; transient timestamps disposable."
        classification: operational_private
        retention: {policy: canonical_git_decision_retention, rule: "Canonical retention в Git/decisions manifest не зависит от DB row."}
        security: "Rationale/evidence не копируются в operational audit; approver separation проверяет GO до accept."
        columns:
          decision_id: {type: uuid, nullable: false}
          proposal_id: {type: text, nullable: false}
          proposal_sha: {type: text, nullable: false}
          space_id: {type: text, nullable: false}
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          base_sha: {type: text, nullable: false}
          action: {type: text, nullable: false}
          actor_stable_id: {type: text, nullable: false}
          actor_type: {type: text, nullable: false}
          authz_context_id: {type: uuid, nullable: true, reference_kind: logical_api_only}
          decided_at: {type: timestamptz, nullable: false}
          request_id: {type: text, nullable: true}
          payload_hash: {type: text, nullable: false}
          rationale: {type: text, nullable: false}
          evidence: {type: jsonb, nullable: false}
          policy_bundle_id: {type: text, nullable: false}
          access_policy_revision: {type: text, nullable: false}
          approval_policy_revision: {type: text, nullable: false}
          record_sha256: {type: text, nullable: false}
          canonical_json_sha256: {type: text, nullable: true}
          note_body_sha256: {type: text, nullable: true}
          tag_message_sha256: {type: text, nullable: true}
          note_id: {type: text, nullable: true}
          tag_name: {type: text, nullable: true}
          tag_object_sha: {type: text, nullable: true}
          tag_target_sha: {type: text, nullable: true}
          supersedes_decision_id: {type: uuid, nullable: true}
          state: {type: text, nullable: false}
          merge_operation_allowed: {type: boolean, nullable: false}
          invalid_reason: {type: text, nullable: true}
          merge_commit_sha: {type: text, nullable: true}
          mr_closure_evidence: {type: jsonb, nullable: false}
          state_evidence: {type: jsonb, nullable: false}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [decision_id]
        foreign_keys:
          - columns: [proposal_id, proposal_sha, repository_id, space_id, target_branch, base_sha]
            references: {schema: kb_ops, table: proposal_versions, columns: [proposal_id, proposal_sha, repository_id, space_id, target_branch, base_sha]}
            on_delete: restrict
          - columns: [supersedes_decision_id, proposal_id, proposal_sha, space_id, repository_id, target_branch]
            references: {schema: kb_ops, table: decisions, columns: [decision_id, proposal_id, proposal_sha, space_id, repository_id, target_branch]}
            on_delete: restrict
        uniques:
          - columns: [decision_id, space_id, repository_id, target_branch]
          - columns: [decision_id, space_id, repository_id, target_branch, action]
          - columns: [decision_id, space_id, repository_id, target_branch, action, base_sha, proposal_sha]
          - columns: [decision_id, space_id, repository_id, target_branch, action, base_sha, proposal_sha, merge_operation_allowed]
          - columns: [decision_id, space_id, repository_id, target_branch, base_sha, proposal_sha]
          - columns: [decision_id, proposal_id, proposal_sha, space_id, repository_id, target_branch]
          - columns: [repository_id, note_id]
            predicate: "note_id IS NOT NULL"
          - columns: [repository_id, tag_name]
            predicate: "tag_name IS NOT NULL"
          - columns: [repository_id, target_branch, merge_commit_sha]
            predicate: "merge_commit_sha IS NOT NULL"
        checks:
          - macro: git_sha
            columns: [proposal_sha, base_sha, tag_object_sha, tag_target_sha, merge_commit_sha, access_policy_revision, approval_policy_revision]
          - macro: sha256
            columns: [record_sha256, canonical_json_sha256, note_body_sha256, tag_message_sha256, payload_hash]
          - macro: nonempty
            columns: [actor_stable_id, policy_bundle_id]
          - expression: "action IN ('accept','reject','cancel')"
          - expression: "actor_type = 'human'"
          - expression: "state IN ('recorded','merge_attempted','merged','failed','conflicted','invalid')"
          - expression: "merge_operation_allowed = (action = 'accept' AND state <> 'recorded')"
          - expression: "(action = 'accept') OR state IN ('recorded','invalid')"
          - expression: "state <> 'merged' OR (action = 'accept' AND merge_commit_sha IS NOT NULL AND note_id IS NOT NULL AND tag_name IS NOT NULL AND tag_target_sha = proposal_sha)"
          - expression: "state NOT IN ('recorded','merge_attempted','merged','failed','conflicted') OR (note_id IS NOT NULL AND tag_name IS NOT NULL AND tag_object_sha IS NOT NULL AND tag_target_sha = proposal_sha AND canonical_json_sha256 IS NOT NULL AND note_body_sha256 IS NOT NULL AND tag_message_sha256 IS NOT NULL)"
          - expression: "state = 'invalid' OR tag_target_sha = proposal_sha"
          - expression: "state = 'invalid' OR invalid_reason IS NULL"
          - expression: "state <> 'invalid' OR invalid_reason IN ('missing_integrity','mismatched_integrity','policy_mismatch','self_approval','incomplete_review','recovery_evidence_invalid')"
          - expression: "state <> 'invalid' OR (note_id IS NOT NULL AND tag_name IS NOT NULL AND tag_object_sha IS NOT NULL AND canonical_json_sha256 IS NOT NULL AND note_body_sha256 IS NOT NULL AND tag_message_sha256 IS NOT NULL) OR invalid_reason = 'missing_integrity'"
          - expression: "state <> 'invalid' OR tag_target_sha = proposal_sha OR invalid_reason = 'mismatched_integrity'"
          - expression: "NOT (state = 'recorded' AND action IN ('reject','cancel')) OR (jsonb_typeof(mr_closure_evidence) = 'array' AND jsonb_array_length(mr_closure_evidence) > 0)"
        indexes:
          - columns: [repository_id, target_branch, state]
          - columns: [proposal_id, proposal_sha]
          - columns: [state, updated_at]
      merge_operations:
        purpose: "Durable operational merge attempts с owner/fencing и sanitized transient diagnostics."
        canonical_source: "Outcome только из GitLab merge commit/parents/trailers; attempt row не доказывает результат."
        rebuildable: false
        rebuild_strategy: "Transient attempts/errors не восстанавливаются точно; Git-derived outcome создаётся после reconciliation."
        classification: operational
        retention: {policy: merge_attempt_owner_decision, rule: "Unresolved rows не удаляются; transient history не является canonical audit."}
        security: "No credentials, request payload или raw response; stale owner не может update без fencing."
        columns:
          merge_operation_id: {type: uuid, nullable: false}
          decision_id: {type: uuid, nullable: false}
          decision_action: {type: text, nullable: false}
          decision_merge_allowed: {type: boolean, nullable: false}
          attempt_no: {type: integer, nullable: false}
          space_id: {type: text, nullable: false}
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          base_sha: {type: text, nullable: false}
          proposal_sha: {type: text, nullable: false}
          owner_id: {type: text, nullable: false}
          fencing_token: {type: bigint, nullable: false}
          state: {type: text, nullable: false}
          request_fingerprint: {type: text, nullable: false}
          request_completed: {type: boolean, nullable: false}
          request_completion_evidence: {type: jsonb, nullable: false}
          git_outcome_evidence: {type: jsonb, nullable: false}
          merge_commit_sha: {type: text, nullable: true}
          requested_at: {type: timestamptz, nullable: true}
          response_at: {type: timestamptz, nullable: true}
          verified_at: {type: timestamptz, nullable: true}
          error_code: {type: text, nullable: true}
          error_detail: {type: text, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [merge_operation_id]
        foreign_keys:
          - columns: [decision_id, space_id, repository_id, target_branch, decision_action, base_sha, proposal_sha, decision_merge_allowed]
            references: {schema: kb_ops, table: decisions, columns: [decision_id, space_id, repository_id, target_branch, action, base_sha, proposal_sha, merge_operation_allowed]}
            on_delete: restrict
          - columns: [repository_id, target_branch, space_id]
            references: {schema: kb_ops, table: target_barriers, columns: [repository_id, target_branch, space_id]}
            on_delete: restrict
        uniques:
          - columns: [decision_id, attempt_no]
          - columns: [repository_id, target_branch, proposal_sha]
            predicate: "state = 'verified_merged'"
        checks:
          - macro: git_sha
            columns: [base_sha, proposal_sha, merge_commit_sha]
          - macro: sha256
            columns: [request_fingerprint]
          - macro: nonempty
            columns: [owner_id]
          - expression: "attempt_no > 0 AND fencing_token > 0"
          - expression: "decision_action = 'accept' AND decision_merge_allowed"
          - expression: "state IN ('prepared','call_inflight','unknown','verified_merged','verified_not_merged','conflicted','invalid')"
          - expression: "state <> 'verified_merged' OR (merge_commit_sha IS NOT NULL AND request_completed AND verified_at IS NOT NULL)"
          - expression: "state <> 'verified_not_merged' OR (merge_commit_sha IS NULL AND request_completed AND verified_at IS NOT NULL)"
          - expression: "state <> 'conflicted' OR (merge_commit_sha IS NULL AND request_completed AND verified_at IS NOT NULL)"
          - expression: "state = 'verified_merged' OR merge_commit_sha IS NULL"
        indexes:
          - columns: [repository_id, target_branch, state]
          - columns: [owner_id, fencing_token]
          - columns: [merge_commit_sha]
      target_barriers:
        purpose: "Durable per-repository/target recovery_required и advisory-lock owner/fencing metadata."
        canonical_source: "Merge outcome в GitLab; barrier является durable operational safety state."
        rebuildable: true
        rebuild_strategy: "Conservative rebuild: bootstrap freeze + recovery_required для unresolved/недоказанных targets; никогда не очищать молча."
        classification: operational
        retention: {policy: durable_until_conclusive_reconciliation, rule: "Active barrier нельзя удалять по TTL или считать отсутствие row отрицательным доказательством."}
        security: "Только GO writer; timeout/lock expiry не снимает recovery; private payload отсутствует."
        columns:
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          space_id: {type: text, nullable: false}
          recovery_required: {type: boolean, nullable: false}
          recovery_reason: {type: text, nullable: true}
          active_decision_id: {type: uuid, nullable: true}
          active_decision_action: {type: text, nullable: true}
          lock_owner_id: {type: text, nullable: true}
          fencing_token: {type: bigint, nullable: false}
          lock_acquired_at: {type: timestamptz, nullable: true}
          lock_expires_at: {type: timestamptz, nullable: true}
          bootstrap_frozen: {type: boolean, nullable: false}
          last_reconciliation_run_id: {type: uuid, nullable: true}
          last_reconciled_at: {type: timestamptz, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [repository_id, target_branch]
        foreign_keys:
          - columns: [active_decision_id, space_id, repository_id, target_branch, active_decision_action]
            references: {schema: kb_ops, table: decisions, columns: [decision_id, space_id, repository_id, target_branch, action]}
            on_delete: restrict
          - columns: [last_reconciliation_run_id, space_id, repository_id, target_branch]
            references: {schema: kb_ops, table: reconciliation_runs, columns: [reconciliation_run_id, space_id, repository_id, target_branch]}
            on_delete: restrict
        uniques:
          - columns: [repository_id, target_branch, space_id]
        checks:
          - macro: nonempty
            columns: [space_id, repository_id, target_branch]
          - expression: "fencing_token > 0"
          - expression: "NOT recovery_required OR recovery_reason IS NOT NULL"
          - expression: "recovery_required OR active_decision_id IS NULL"
          - expression: "(active_decision_id IS NULL AND active_decision_action IS NULL) OR (active_decision_id IS NOT NULL AND active_decision_action = 'accept')"
        indexes:
          - columns: [recovery_required]
            predicate: "recovery_required"
          - columns: [active_decision_id]
          - columns: [lock_owner_id, fencing_token]
      target_barrier_decisions:
        purpose: "Полный набор unresolved/resolved accept decisions, связанных с одним durable per-target barrier."
        canonical_source: "Canonical accept DecisionRecords + Git-derived target ancestry/request-completion evidence."
        rebuildable: true
        rebuild_strategy: "Conservative rebuild связывает каждый accept без доказанного outcome как unresolved/unknown; отсутствие row не является no-merge proof."
        classification: operational
        retention: {policy: durable_until_target_outcome_proven, rule: "Unresolved/unknown/quarantined links нельзя удалять или resolving по TTL; resolved evidence сохраняется по owner audit policy."}
        security: "Только GO; same-Space/repository/target composite FK; sanitized evidence без request/response payload."
        columns:
          repository_id: {type: text, nullable: false}
          target_branch: {type: text, nullable: false}
          space_id: {type: text, nullable: false}
          decision_id: {type: uuid, nullable: false}
          decision_action: {type: text, nullable: false}
          link_state: {type: text, nullable: false}
          merge_outcome: {type: text, nullable: false}
          classification: {type: text, nullable: false}
          request_completed: {type: boolean, nullable: false}
          outcome_evidence: {type: jsonb, nullable: false}
          linked_at: {type: timestamptz, nullable: false}
          resolved_at: {type: timestamptz, nullable: true}
          created_at: {type: timestamptz, nullable: false}
          updated_at: {type: timestamptz, nullable: false}
        primary_key: [repository_id, target_branch, decision_id]
        foreign_keys:
          - columns: [repository_id, target_branch, space_id]
            references: {schema: kb_ops, table: target_barriers, columns: [repository_id, target_branch, space_id]}
            on_delete: restrict
          - columns: [decision_id, space_id, repository_id, target_branch, decision_action]
            references: {schema: kb_ops, table: decisions, columns: [decision_id, space_id, repository_id, target_branch, action]}
            on_delete: restrict
        uniques:
          - columns: [decision_id, repository_id, target_branch, space_id]
        checks:
          - expression: "decision_action = 'accept'"
          - expression: "link_state IN ('unresolved','resolved')"
          - expression: "merge_outcome IN ('unknown','verified_merged','verified_not_merged')"
          - expression: "classification IN ('pending','merged','failed','conflicted','invalid','quarantined')"
          - expression: "link_state <> 'unresolved' OR (merge_outcome = 'unknown' AND resolved_at IS NULL)"
          - expression: "link_state <> 'resolved' OR (merge_outcome <> 'unknown' AND request_completed AND resolved_at IS NOT NULL)"
          - expression: "classification NOT IN ('pending','quarantined') OR (link_state = 'unresolved' AND merge_outcome = 'unknown')"
          - expression: "classification <> 'merged' OR merge_outcome = 'verified_merged'"
          - expression: "classification NOT IN ('failed','conflicted') OR (merge_outcome = 'verified_not_merged' AND request_completed)"
        indexes:
          - columns: [repository_id, target_branch, link_state]
          - columns: [decision_id, link_state]
      idempotency_records:
        purpose: "Глобальный idempotency-key registry с actor+route+payload binding."
        canonical_source: "GitLab decision_id и (repository_id,target_branch,proposal_sha) являются durable backstop."
        rebuildable: false
        rebuild_strategy: "Точный HTTP replay journal не гарантирован; Git-derived dedupe сохраняется."
        classification: operational
        retention: {policy: idempotency_replay_owner_decision_unknown, rule: "Истечение replay record не разрешает blind retry uncertain merge."}
        security: "Тот же key с другим actor, route или payload -> IDEMPOTENCY_KEY_REUSED до insert; raw request/response не хранится."
        columns:
          actor_stable_id: {type: text, nullable: false}
          route: {type: text, nullable: false, note: "Normalized operation/route плюс concrete path parameters, не только route template."}
          idempotency_key: {type: text, nullable: false}
          payload_hash: {type: text, nullable: false}
          operation_type: {type: text, nullable: false}
          request_id: {type: text, nullable: false}
          run_id: {type: text, nullable: true}
          decision_id: {type: uuid, nullable: true}
          result_state: {type: text, nullable: false}
          result_reference: {type: jsonb, nullable: false}
          created_at: {type: timestamptz, nullable: false}
          expires_at: {type: timestamptz, nullable: true}
          last_replayed_at: {type: timestamptz, nullable: true}
        primary_key: [idempotency_key]
        foreign_keys:
          - columns: [decision_id]
            references: {schema: kb_ops, table: decisions, columns: [decision_id]}
